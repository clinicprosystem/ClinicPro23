<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicPro - الأطباء</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: #f0f4f8; min-height: 100vh; }

        .sidebar {
            position: fixed; right: 0; top: 0; bottom: 0; width: 260px;
            background: #1A5F7A; color: white; padding: 0; z-index: 1000;
            transition: transform 0.3s ease; overflow-y: auto;
        }
        .sidebar .logo { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 22px; font-weight: 800; }
        .sidebar .logo span { color: #57C0E8; }
        .sidebar .user-info { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .sidebar .user-info .avatar { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.2); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 8px; }
        .sidebar .user-info .name { font-weight: 700; font-size: 16px; }
        .sidebar .user-info .role { font-size: 12px; color: rgba(255,255,255,0.6); }
        .sidebar ul { list-style: none; padding: 12px 0; }
        .sidebar ul li { padding: 12px 24px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 12px; border-right: 4px solid transparent; }
        .sidebar ul li:hover, .sidebar ul li.active { background: rgba(255,255,255,0.08); border-right-color: #57C0E8; }
        .sidebar ul li i { width: 20px; text-align: center; font-size: 16px; }
        .sidebar ul li.logout { color: #f87171; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 16px; }
        .sidebar ul li.logout:hover { background: rgba(239, 68, 68, 0.15); }

        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 999; }

        .main-content { margin-right: 260px; padding: 20px; min-height: 100vh; }

        .header {
            background: white; padding: 12px 20px; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
        }
        .header .left { display: flex; align-items: center; gap: 12px; }
        .header .left h1 { font-size: 20px; color: #1A5F7A; }
        .header .left .hamburger { display: none; background: none; border: none; font-size: 24px; cursor: pointer; color: #1A5F7A; }
        .header .actions button { background: none; border: none; font-size: 18px; cursor: pointer; color: #555; padding: 8px; border-radius: 50%; transition: background 0.3s; }
        .header .actions button:hover { background: #f0f4f8; }

        .doctor-card {
            background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex; align-items: center; gap: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .doctor-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }

        .doctor-card .avatar {
            width: 50px; height: 50px; border-radius: 50%;
            background: rgba(26,95,122,0.1); display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #1A5F7A; flex-shrink: 0;
        }
        .doctor-card .info { flex: 1; }
        .doctor-card .info .name { font-weight: 700; font-size: 16px; color: #1e293b; }
        .doctor-card .info .phone { font-size: 13px; color: #64748b; }

        .doctor-card .percentage {
            background: rgba(5, 150, 105, 0.1); color: #059669;
            padding: 4px 14px; border-radius: 20px; font-weight: 700; font-size: 14px;
        }
        .doctor-card .actions { display: flex; gap: 4px; }
        .doctor-card .actions button {
            background: none; border: none; padding: 6px 10px; border-radius: 8px; cursor: pointer;
            transition: background 0.2s; font-size: 16px;
        }
        .doctor-card .actions button:hover { background: #f1f5f9; }
        .doctor-card .actions button.delete { color: #ef4444; }

        .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; }
        .empty-state i { font-size: 64px; margin-bottom: 16px; color: #cbd5e1; }
        .empty-state h3 { font-size: 18px; color: #64748b; }
        .empty-state p { font-size: 14px; }

        .loader { display: flex; justify-content: center; align-items: center; min-height: 200px; }
        .loader .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #1A5F7A; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .fab {
            position: fixed; bottom: 30px; left: 30px; width: 56px; height: 56px;
            border-radius: 50%; background: #57C0E8; color: white; border: none;
            font-size: 28px; cursor: pointer; box-shadow: 0 4px 16px rgba(87,192,232,0.4);
            transition: transform 0.2s; z-index: 100;
        }
        .fab:hover { transform: scale(1.05); }

        /* ===== مودال تعديل النسبة ===== */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 2000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-content {
            background: white; border-radius: 16px; padding: 30px; max-width: 400px; width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .modal-content h3 { color: #1A5F7A; margin-bottom: 16px; text-align: center; }
        .modal-content .doctor-name { text-align: center; font-size: 16px; color: #64748b; margin-bottom: 16px; }
        .modal-content input {
            width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 12px;
            font-size: 16px; text-align: center; margin-bottom: 16px;
        }
        .modal-content input:focus { border-color: #1A5F7A; outline: none; }
        .modal-content .buttons { display: flex; gap: 12px; }
        .modal-content .buttons button {
            flex: 1; padding: 12px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: opacity 0.3s;
        }
        .modal-content .buttons button:hover { opacity: 0.85; }
        .modal-content .buttons .cancel { background: #f1f5f9; color: #475569; }
        .modal-content .buttons .save { background: #1A5F7A; color: white; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(100%); width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.show { display: block; }
            .main-content { margin-right: 0; }
            .header .left .hamburger { display: block; }
            .fab { bottom: 20px; left: 20px; width: 48px; height: 48px; font-size: 22px; }
            .doctor-card { flex-wrap: wrap; }
        }
        @media (max-width: 480px) {
            .header .left h1 { font-size: 16px; }
        }
    </style>
</head>
<body>

<!-- القائمة الجانبية -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
    <div class="logo">🏥 <span>Clinic</span>Pro</div>
    <div class="user-info">
        <div class="avatar">👤</div>
        <div class="name" id="userName">طبيب الأسنان</div>
        <div class="role" id="userRole">صاحب عيادة</div>
    </div>
    <ul>
        <li onclick="window.location.href='dashboard.html'"><i class="fas fa-chart-pie"></i> الرئيسية</li>
        <li onclick="window.location.href='patients.html'"><i class="fas fa-users"></i> المرضى</li>
        <li onclick="window.location.href='treatments.html'"><i class="fas fa-tooth"></i> المعالجات</li>
        <li onclick="window.location.href='services.html'"><i class="fas fa-list"></i> الخدمات</li>
        <li class="active"><i class="fas fa-user-md"></i> الأطباء</li>
        <li onclick="window.location.href='secretaries.html'"><i class="fas fa-user-tie"></i> السكرتيرات</li>
        <li onclick="window.location.href='lab.html'"><i class="fas fa-flask"></i> المعمل</li>
        <li onclick="window.location.href='reports.html'"><i class="fas fa-chart-bar"></i> التقارير</li>
        <li onclick="window.location.href='notifications.html'"><i class="fas fa-bell"></i> الإشعارات</li>
        <li onclick="window.location.href='settings.html'"><i class="fas fa-cog"></i> الإعدادات</li>
        <li onclick="window.location.href='profile.html'"><i class="fas fa-user-circle"></i> الملف الشخصي</li>
        <li class="logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</li>
    </ul>
</div>

<!-- المحتوى الرئيسي -->
<div class="main-content">
    <div class="header">
        <div class="left">
            <button class="hamburger" onclick="toggleSidebar()">☰</button>
            <h1>👨‍⚕️ الأطباء</h1>
        </div>
        <div class="actions">
            <button onclick="loadDoctors()" title="تحديث"><i class="fas fa-sync-alt"></i></button>
        </div>
    </div>

    <div id="doctorsList">
        <div class="loader"><div class="spinner"></div></div>
    </div>
</div>

<!-- زر الإضافة -->
<button class="fab" onclick="addDoctor()">+</button>

<!-- مودال تعديل النسبة -->
<div class="modal-overlay" id="percentageModal">
    <div class="modal-content">
        <h3>📊 تعديل نسبة الطبيب</h3>
        <div class="doctor-name" id="modalDoctorName">الطبيب</div>
        <input type="number" id="modalPercentage" placeholder="النسبة المئوية" min="0" max="100">
        <div class="buttons">
            <button class="cancel" onclick="closeModal()">إلغاء</button>
            <button class="save" onclick="savePercentage()">حفظ</button>
        </div>
    </div>
</div>

<script>
// ============================================
// ✅ الإعدادات الأساسية
// ============================================
const API_BASE = 'https://marginal-addi-1realitylotter1-37028393.koyeb.app/api';
let token = localStorage.getItem('token') || '';
let userData = JSON.parse(localStorage.getItem('user') || '{}');
let doctors = [];
let editingDoctorId = null;

// ============================================
// ✅ دوال API
// ============================================
async function apiCall(endpoint, method = 'GET', body = null) {
    const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const options = { method, headers };
    if (body) options.body = JSON.stringify(body);
    try {
        const response = await fetch(`${API_BASE}${endpoint}`, options);
        if (response.status === 401) { localStorage.removeItem('token'); window.location.href = 'index.html'; return null; }
        return await response.json();
    } catch (e) { console.error('❌ API Error:', e); return null; }
}

// ============================================
// ✅ تحميل الأطباء (بدون بيانات افتراضية)
// ============================================
async function loadDoctors() {
    const list = document.getElementById('doctorsList');
    list.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

    try {
        const response = await apiCall('/clinics/doctors');
        if (response?.doctors) {
            doctors = response.doctors;
            renderDoctors();
            return;
        }
    } catch(e) {
        console.warn('⚠️ Failed to fetch from server:', e);
    }

    // ❌ لا توجد بيانات افتراضية - عرض خطأ فقط
    list.innerHTML = `
        <div class="empty-state">
            <i class="fas fa-exclamation-circle"></i>
            <h3>فشل في تحميل البيانات</h3>
            <p>يرجى التحقق من اتصالك بالإنترنت</p>
            <button onclick="loadDoctors()" style="margin-top:12px;padding:8px 24px;background:#1A5F7A;color:white;border:none;border-radius:8px;cursor:pointer;">
                <i class="fas fa-sync-alt"></i> إعادة المحاولة
            </button>
        </div>
    `;
}

// ============================================
// ✅ عرض الأطباء
// ============================================
function renderDoctors() {
    const list = document.getElementById('doctorsList');

    if (doctors.length === 0) {
        list.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-user-md"></i>
                <h3>لا يوجد أطباء</h3>
                <p>اضغط على زر + لإضافة طبيب جديد</p>
            </div>
        `;
        return;
    }

    list.innerHTML = doctors.map(d => `
        <div class="doctor-card">
            <div class="avatar">👨‍⚕️</div>
            <div class="info">
                <div class="name">${d.name || 'غير محدد'}</div>
                <div class="phone">📞 ${d.phone || '-'}</div>
            </div>
            <div class="percentage">نسبة ${d.percentage || 0}%</div>
            <div class="actions">
                <button onclick="openEditModal('${d._id}','${d.name}','${d.percentage || 0}')" title="تعديل النسبة"><i class="fas fa-edit"></i></button>
                <button class="delete" onclick="deleteDoctor('${d._id}','${d.name}')" title="حذف"><i class="fas fa-trash"></i></button>
            </div>
        </div>
    `).join('');
}

// ============================================
// ✅ مودال تعديل النسبة
// ============================================
function openEditModal(id, name, percentage) {
    editingDoctorId = id;
    document.getElementById('modalDoctorName').textContent = name;
    document.getElementById('modalPercentage').value = percentage;
    document.getElementById('percentageModal').classList.add('show');
}

function closeModal() {
    document.getElementById('percentageModal').classList.remove('show');
    editingDoctorId = null;
}

function savePercentage() {
    const percentage = parseInt(document.getElementById('modalPercentage').value);
    if (isNaN(percentage) || percentage < 0 || percentage > 100) {
        alert('⚠️ النسبة يجب أن تكون بين 0 و 100');
        return;
    }
    const doctor = doctors.find(d => d._id === editingDoctorId);
    if (doctor) {
        doctor.percentage = percentage;
        renderDoctors();
    }
    closeModal();
    alert('✅ تم تحديث النسبة');
}

// ============================================
// ✅ إضافة طبيب جديد (إرسال إلى السيرفر)
// ============================================
async function addDoctor() {
    const name = prompt('👨‍⚕️ أدخل اسم الطبيب:');
    if (!name || name.trim() === '') return;
    
    const phone = prompt('📞 أدخل رقم الجوال:');
    if (!phone || phone.trim() === '') return;
    
    const percentage = prompt('📊 أدخل نسبة الطبيب (0-100):', '0');
    const percentageNum = parseInt(percentage) || 0;
    
    if (percentageNum < 0 || percentageNum > 100) {
        alert('⚠️ النسبة يجب أن تكون بين 0 و 100');
        return;
    }
    
    try {
        const response = await apiCall('/clinics/add-doctor', 'POST', {
            name: name.trim(),
            phone: phone.trim(),
            percentage: percentageNum
        });
        
        if (response?.success) {
            alert('✅ تم إضافة الطبيب بنجاح');
            loadDoctors();
        } else {
            alert('❌ فشل في إضافة الطبيب: ' + (response?.error || 'خطأ غير معروف'));
        }
    } catch(e) {
        alert('❌ حدث خطأ: ' + e.message);
    }
}

// ============================================
// ✅ حذف طبيب
// ============================================
async function deleteDoctor(id, name) {
    if (!confirm(`🗑️ هل أنت متأكد من حذف الطبيب "${name}"؟`)) return;
    
    try {
        const response = await apiCall(`/clinics/doctors/${id}`, 'DELETE');
        if (response?.success) {
            alert('✅ تم حذف الطبيب بنجاح');
            loadDoctors();
        } else {
            alert('❌ فشل في حذف الطبيب: ' + (response?.error || 'خطأ غير معروف'));
        }
    } catch(e) {
        alert('❌ حدث خطأ: ' + e.message);
    }
}

// ============================================
// ✅ تعديل نسبة الطبيب (إرسال إلى السيرفر)
// ============================================
async function savePercentage() {
    const percentage = parseInt(document.getElementById('modalPercentage').value);
    if (isNaN(percentage) || percentage < 0 || percentage > 100) {
        alert('⚠️ النسبة يجب أن تكون بين 0 و 100');
        return;
    }
    
    try {
        const response = await apiCall(`/clinics/doctors/${editingDoctorId}/percentage`, 'PUT', {
            percentage: percentage
        });
        
        if (response?.success) {
            alert('✅ تم تحديث النسبة بنجاح');
            closeModal();
            loadDoctors();
        } else {
            alert('❌ فشل في تحديث النسبة: ' + (response?.error || 'خطأ غير معروف'));
        }
    } catch(e) {
        alert('❌ حدث خطأ: ' + e.message);
    }
}

// ============================================
// ✅ دوال مساعدة
// ============================================
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('show');
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'index.html';
}

// ============================================
// ✅ بدء التشغيل
// ============================================
if (!token || token === 'null' || token === 'undefined') {
    window.location.href = 'index.html';
}

if (userData?.name) {
    document.getElementById('userName').textContent = userData.name;
    document.getElementById('userRole').textContent =
        userData.role === 'clinic_owner' ? 'صاحب عيادة' :
        userData.role === 'university_student' ? 'طالب جامعي' :
        userData.role === 'secretary' ? 'سكرتير' :
        userData.role === 'doctor' ? 'طبيب' : 'مستخدم';
}

loadDoctors();

window.addEventListener('resize', () => {
    if (window.innerWidth > 768) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('show');
    }
});
</script>

</body>
</html>
