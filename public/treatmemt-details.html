<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicPro - تفاصيل المعالجة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: #f0f4f8; min-height: 100vh; }

        .sidebar {
            position: fixed; right: 0; top: 0; bottom: 0; width: 260px;
            background: #1A5F7A; color: white; padding: 0; z-index: 1000;
            transition: transform 0.3s ease; overflow-y: auto;
        }
        .sidebar .logo { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 22px; font-weight: 800; }
        .sidebar .logo span { color: #57C0E8; }
        .sidebar .user-info { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .sidebar .user-info .avatar { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.2); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 8px; }
        .sidebar .user-info .name { font-weight: 700; font-size: 16px; }
        .sidebar .user-info .role { font-size: 12px; color: rgba(255,255,255,0.6); }
        .sidebar ul { list-style: none; padding: 12px 0; }
        .sidebar ul li { padding: 12px 24px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 12px; border-right: 4px solid transparent; }
        .sidebar ul li:hover, .sidebar ul li.active { background: rgba(255,255,255,0.08); border-right-color: #57C0E8; }
        .sidebar ul li i { width: 20px; text-align: center; font-size: 16px; }
        .sidebar ul li.logout { color: #f87171; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 16px; }
        .sidebar ul li.logout:hover { background: rgba(239, 68, 68, 0.15); }

        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 999; }

        .main-content { margin-right: 260px; padding: 20px; min-height: 100vh; }

        .header {
            background: white; padding: 12px 20px; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
        }
        .header .left { display: flex; align-items: center; gap: 12px; }
        .header .left h1 { font-size: 20px; color: #1A5F7A; }
        .header .left .hamburger { display: none; background: none; border: none; font-size: 24px; cursor: pointer; color: #1A5F7A; }
        .header .actions button { background: none; border: none; font-size: 18px; cursor: pointer; color: #555; padding: 8px; border-radius: 50%; transition: background 0.3s; }
        .header .actions button:hover { background: #f0f4f8; }

        .card {
            background: white; border-radius: 16px; padding: 16px; margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .card .card-title {
            font-size: 16px; font-weight: 700; color: #1A5F7A; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }
        .card .card-title .icon {
            width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .card .card-title .icon.blue { background: rgba(26,95,122,0.1); color: #1A5F7A; }
        .card .card-title .icon.green { background: rgba(5,150,105,0.1); color: #059669; }
        .card .card-title .icon.purple { background: rgba(168,85,247,0.1); color: #7c3aed; }
        .card .card-title .icon.orange { background: rgba(245,158,11,0.1); color: #d97706; }

        .info-row {
            display: flex; padding: 6px 0; border-bottom: 1px solid #f8fafc;
        }
        .info-row:last-child { border-bottom: none; }
        .info-row .label { width: 100px; color: #64748b; font-size: 14px; }
        .info-row .value { flex: 1; font-weight: 500; font-size: 14px; text-align: left; }

        .highlight-box {
            background: rgba(26,95,122,0.08); border-radius: 12px; padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center; margin-top: 8px;
        }
        .highlight-box .label { font-size: 16px; font-weight: 700; color: #1A5F7A; }
        .highlight-box .value { font-size: 18px; font-weight: 800; color: #1A5F7A; }

        .btn-group { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
        .btn-group .btn {
            flex: 1; min-width: 120px; padding: 10px; border: none; border-radius: 12px;
            font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-group .btn:hover { opacity: 0.85; }
        .btn-group .btn.primary { background: #1A5F7A; color: white; }
        .btn-group .btn.outline { background: transparent; border: 2px solid #f59e0b; color: #f59e0b; }
        .btn-group .btn.outline:hover { background: #fef3c7; }

        .payment-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 0; border-bottom: 1px solid #f1f5f9;
        }
        .payment-item:last-child { border-bottom: none; }
        .payment-item .left { display: flex; align-items: center; gap: 8px; }
        .payment-item .left .icon { font-size: 16px; }
        .payment-item .left .icon.payment { color: #059669; }
        .payment-item .left .icon.refund { color: #ef4444; }
        .payment-item .left .details .title { font-weight: 500; }
        .payment-item .left .details .note { font-size: 12px; color: #94a3b8; }
        .payment-item .amount { font-weight: 700; }
        .payment-item .amount.payment { color: #059669; }
        .payment-item .amount.refund { color: #ef4444; }
        .payment-item .date { font-size: 11px; color: #94a3b8; }

        .teeth-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .teeth-list .tooth {
            padding: 2px 10px; background: rgba(26,95,122,0.08); border-radius: 12px;
            font-size: 12px; color: #1A5F7A;
        }

        .empty-state { text-align: center; padding: 20px; color: #94a3b8; }
        .empty-state i { font-size: 32px; margin-bottom: 8px; color: #cbd5e1; }

        .loader { display: flex; justify-content: center; padding: 40px; }
        .loader .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #1A5F7A; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(100%); width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.show { display: block; }
            .main-content { margin-right: 0; }
            .header .left .hamburger { display: block; }
            .info-row .label { width: 80px; font-size: 12px; }
            .btn-group .btn { font-size: 12px; padding: 8px; }
        }
        @media (max-width: 480px) {
            .header .left h1 { font-size: 16px; }
            .card { padding: 12px; }
        }
    </style>
</head>
<body>

<!-- القائمة الجانبية -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
    <div class="logo">🏥 <span>Clinic</span>Pro</div>
    <div class="user-info">
        <div class="avatar">👤</div>
        <div class="name" id="userName">طبيب الأسنان</div>
        <div class="role" id="userRole">صاحب عيادة</div>
    </div>
    <ul>
        <li onclick="window.location.href='dashboard.html'"><i class="fas fa-chart-pie"></i> الرئيسية</li>
        <li onclick="window.location.href='patients.html'"><i class="fas fa-users"></i> المرضى</li>
        <li onclick="window.location.href='treatments.html'"><i class="fas fa-tooth"></i> المعالجات</li>
        <li onclick="window.location.href='services.html'"><i class="fas fa-list"></i> الخدمات</li>
        <li onclick="window.location.href='doctors.html'"><i class="fas fa-user-md"></i> الأطباء</li>
        <li onclick="window.location.href='secretaries.html'"><i class="fas fa-user-tie"></i> السكرتيرات</li>
        <li onclick="window.location.href='lab.html'"><i class="fas fa-flask"></i> المعمل</li>
        <li onclick="window.location.href='reports.html'"><i class="fas fa-chart-bar"></i> التقارير</li>
        <li onclick="window.location.href='notifications.html'"><i class="fas fa-bell"></i> الإشعارات</li>
        <li onclick="window.location.href='settings.html'"><i class="fas fa-cog"></i> الإعدادات</li>
        <li onclick="window.location.href='profile.html'"><i class="fas fa-user-circle"></i> الملف الشخصي</li>
        <li class="logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</li>
    </ul>
</div>

<!-- المحتوى الرئيسي -->
<div class="main-content">
    <div class="header">
        <div class="left">
            <button class="hamburger" onclick="toggleSidebar()">☰</button>
            <h1>📋 تفاصيل المعالجة</h1>
        </div>
        <div class="actions">
            <button onclick="shareWhatsApp()" title="مشاركة"><i class="fas fa-share-alt"></i></button>
        </div>
    </div>

    <div id="detailsContent">
        <div class="loader"><div class="spinner"></div></div>
    </div>
</div>

<script>
// ============================================
// ✅ الإعدادات الأساسية
// ============================================
const API_BASE = 'https://marginal-addi-1realitylotter1-37028393.koyeb.app/api';
let token = localStorage.getItem('token') || '';
let userData = JSON.parse(localStorage.getItem('user') || '{}');
let treatmentId = new URLSearchParams(window.location.search).get('id') || '';
let treatment = null;
let paidAmount = 0;
let remainingAmount = 0;
let payments = [];

// ============================================
// ✅ دوال API
// ============================================
async function apiCall(endpoint, method = 'GET', body = null) {
    const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const options = { method, headers };
    if (body) options.body = JSON.stringify(body);
    try {
        const response = await fetch(`${API_BASE}${endpoint}`, options);
        if (response.status === 401) { localStorage.removeItem('token'); window.location.href = 'index.html'; return null; }
        return await response.json();
    } catch (e) { console.error('❌ API Error:', e); return null; }
}

// ============================================
// ✅ تحميل البيانات
// ============================================
async function loadTreatment() {
    const content = document.getElementById('detailsContent');
    content.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

    try {
        const response = await apiCall(`/treatments/${treatmentId}`);
        if (response?.success && response?.treatment) {
            treatment = response.treatment;
            // جلب حالة الدفع
            const paymentStatus = await apiCall(`/treatments/${treatmentId}/payment-status`);
            if (paymentStatus?.success) {
                paidAmount = paymentStatus.paid || 0;
                remainingAmount = paymentStatus.remaining || 0;
            }
            renderDetails();
        } else {
            content.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>المعالجة غير موجودة</p></div>`;
        }
    } catch(e) {
        console.error('❌ Error:', e);
        content.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>حدث خطأ في تحميل البيانات</p></div>`;
    }
}

// ============================================
// ✅ عرض التفاصيل
// ============================================
function renderDetails() {
    const content = document.getElementById('detailsContent');
    if (!treatment) return;

    const t = treatment;
    const serviceName = t.subServiceName || t.serviceName || 'غير محدد';
    const mainServiceName = t.mainServiceName || '';
    const doctorName = t.doctorName || 'الطبيب';
    const originalPrice = t.originalPrice || 0;
    const discount = t.discount || 0;
    const finalPrice = t.finalPrice || originalPrice;
    const date = t.date ? t.date.substring(0, 10) : 'غير محدد';

    const teeth = t.teeth || [];
    const archType = t.archType || '';
    const notes = t.notes || '';

    // الأسنان
    let teethHtml = '';
    if (teeth.length > 0) {
        teethHtml = `
            <div class="teeth-list">
                ${teeth.map(tooth => `<span class="tooth">السن ${tooth.number}</span>`).join('')}
            </div>
        `;
    }
    if (archType) {
        teethHtml += `<div style="margin-top:8px;"><span class="tooth">${archType}</span></div>`;
    }

    // المدفوعات
    let paymentsHtml = '';
    if (payments.length > 0) {
        paymentsHtml = `
            <div class="card">
                <div class="card-title">
                    <span class="icon purple"><i class="fas fa-history"></i></span>
                    سجل المدفوعات
                </div>
                ${payments.map(p => {
                    const isPayment = p.type === 'payment';
                    return `
                        <div class="payment-item">
                            <div class="left">
                                <span class="icon ${isPayment ? 'payment' : 'refund'}">
                                    <i class="fas ${isPayment ? 'fa-arrow-up' : 'fa-arrow-down'}"></i>
                                </span>
                                <div class="details">
                                    <div class="title">${isPayment ? 'دفعة' : 'عودة'}</div>
                                    <div class="note">${p.note || 'لا توجد تفاصيل'}</div>
                                </div>
                            </div>
                            <div>
                                <div class="amount ${isPayment ? 'payment' : 'refund'}">${isPayment ? '+' : '-'}${p.amount} ريال</div>
                                <div class="date">${p.date ? p.date.substring(0, 10) : ''}</div>
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    }

    content.innerHTML = `
        <!-- معلومات عامة -->
        <div class="card">
            <div class="card-title">
                <span class="icon blue"><i class="fas fa-info"></i></span>
                معلومات عامة
            </div>
            <div class="info-row">
                <span class="label">المريض</span>
                <span class="value">${t.patientName || 'غير محدد'}</span>
            </div>
            ${mainServiceName ? `
                <div class="info-row">
                    <span class="label">الخدمة الرئيسية</span>
                    <span class="value">${mainServiceName}</span>
                </div>
            ` : ''}
            <div class="info-row">
                <span class="label">المعالجة</span>
                <span class="value">${serviceName}</span>
            </div>
            <div class="info-row">
                <span class="label">الطبيب</span>
                <span class="value">${doctorName}</span>
            </div>
            <div class="info-row">
                <span class="label">التاريخ</span>
                <span class="value">${date}</span>
            </div>
        </div>

        <!-- المالية -->
        <div class="card">
            <div class="card-title">
                <span class="icon green"><i class="fas fa-coins"></i></span>
                المالية
            </div>
            <div class="info-row">
                <span class="label">السعر الأصلي</span>
                <span class="value">${originalPrice} ريال</span>
            </div>
            ${discount > 0 ? `
                <div class="info-row">
                    <span class="label">الخصم</span>
                    <span class="value">-${discount} ريال</span>
                </div>
            ` : ''}
            <div class="highlight-box">
                <span class="label">المبلغ النهائي</span>
                <span class="value">${finalPrice} ريال</span>
            </div>
        </div>

        <!-- حالة الدفع -->
        <div class="card">
            <div class="card-title">
                <span class="icon purple"><i class="fas fa-payment"></i></span>
                حالة الدفع
            </div>
            <div class="info-row">
                <span class="label">السعر الإجمالي</span>
                <span class="value">${finalPrice} ريال</span>
            </div>
            <div class="info-row">
                <span class="label">المدفوع</span>
                <span class="value" style="color:#059669;font-weight:700;">${paidAmount} ريال</span>
            </div>
            <div class="info-row">
                <span class="label">المتبقي</span>
                <span class="value" style="color:${remainingAmount > 0 ? '#dc2626' : '#059669'};font-weight:700;">${remainingAmount} ريال</span>
            </div>

            <div class="btn-group">
                <button class="btn primary" onclick="addPayment()">
                    <i class="fas fa-plus"></i> إضافة دفعة
                </button>
                <button class="btn outline" onclick="addRefund()">
                    <i class="fas fa-undo"></i> إضافة عودة
                </button>
            </div>
        </div>

        ${paymentsHtml}

        <!-- الأسنان -->
        ${teeth.length > 0 || archType ? `
            <div class="card">
                <div class="card-title">
                    <span class="icon orange"><i class="fas fa-tooth"></i></span>
                    تفاصيل الأسنان
                </div>
                ${teethHtml}
            </div>
        ` : ''}

        <!-- الملاحظات -->
        ${notes ? `
            <div class="card">
                <div class="card-title">
                    <span class="icon blue"><i class="fas fa-note"></i></span>
                    ملاحظات
                </div>
                <div class="info-row">
                    <span class="label">الملاحظات</span>
                    <span class="value">${notes}</span>
                </div>
            </div>
        ` : ''}
    `;
}

// ============================================
// ✅ دوال الإجراءات
// ============================================
function addPayment() {
    alert('💳 إضافة دفعة\n🚧 قيد التطوير');
}

function addRefund() {
    alert('🔄 إضافة عودة\n🚧 قيد التطوير');
}

function shareWhatsApp() {
    if (!treatment) { alert('⚠️ لا توجد بيانات للمشاركة'); return; }
    const serviceName = treatment.subServiceName || treatment.serviceName || 'معالجة';
    const patientName = treatment.patientName || 'مريض';
    const doctorName = treatment.doctorName || 'طبيب';
    const finalPrice = treatment.finalPrice || treatment.originalPrice || 0;
    const date = treatment.date ? treatment.date.substring(0, 10) : '';

    const message = `
📋 تفاصيل المعالجة

👤 المريض: ${patientName}
⚕️ المعالجة: ${serviceName}
👨‍⚕️ الطبيب: ${doctorName}
📅 التاريخ: ${date}
💰 المبلغ: ${finalPrice} ريال
💳 المدفوع: ${paidAmount} ريال
📊 المتبقي: ${remainingAmount} ريال
    `.trim();

    const encoded = encodeURIComponent(message);
    window.open(`https://wa.me/?text=${encoded}`, '_blank');
}

// ============================================
// ✅ دوال مساعدة
// ============================================
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('show');
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'index.html';
}

// ============================================
// ✅ بدء التشغيل
// ============================================
if (!token || token === 'null' || token === 'undefined') {
    window.location.href = 'index.html';
}

if (userData?.name) {
    document.getElementById('userName').textContent = userData.name;
    document.getElementById('userRole').textContent =
        userData.role === 'clinic_owner' ? 'صاحب عيادة' :
        userData.role === 'university_student' ? 'طالب جامعي' :
        userData.role === 'secretary' ? 'سكرتير' :
        userData.role === 'doctor' ? 'طبيب' : 'مستخدم';
}

if (!treatmentId) {
    document.getElementById('detailsContent').innerHTML = `
        <div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>لم يتم تحديد معالجة</p></div>
    `;
} else {
    loadTreatment();
}

window.addEventListener('resize', () => {
    if (window.innerWidth > 768) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('show');
    }
});
</script>

</body>
</html>
