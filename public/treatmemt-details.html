<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>ClinicPro - تفاصيل المعالجة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: #f0f4f8;
            min-height: 100vh;
        }

        :root {
            --primary: #1A5F7A;
            --primary-light: #57C0E8;
            --secondary: #57C0E8;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --radius: 16px;
            --sidebar-width: 270px;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 10px; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--primary);
            color: white;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            box-shadow: -4px 0 20px rgba(0,0,0,0.1);
        }

        .sidebar .logo {
            padding: 24px 20px 16px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .sidebar .logo span { color: var(--primary-light); }
        .sidebar .logo i { margin-left: 8px; }

        .sidebar .user-info {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        .sidebar .user-info .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 8px;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .sidebar .user-info .name {
            font-weight: 700;
            font-size: 16px;
        }

        .sidebar .user-info .role {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin-top: 2px;
        }

        .sidebar ul {
            list-style: none;
            padding: 8px 0;
        }

        .sidebar ul li {
            padding: 11px 24px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 14px;
            border-right: 3px solid transparent;
            font-size: 14px;
        }

        .sidebar ul li:hover {
            background: rgba(255,255,255,0.06);
            border-right-color: rgba(255,255,255,0.3);
        }

        .sidebar ul li.active {
            background: rgba(255,255,255,0.1);
            border-right-color: var(--primary-light);
        }

        .sidebar ul li i {
            width: 20px;
            text-align: center;
            font-size: 16px;
            color: rgba(255,255,255,0.7);
        }

        .sidebar ul li.logout {
            color: #fca5a5;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 16px;
        }

        .sidebar ul li.logout:hover {
            background: rgba(239, 68, 68, 0.12);
            border-right-color: #ef4444;
        }

        .sidebar ul li.logout i { color: #fca5a5; }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 999;
            backdrop-filter: blur(2px);
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-right: var(--sidebar-width);
            padding: 20px 24px;
            min-height: 100vh;
            max-width: calc(100% - var(--sidebar-width));
        }

        /* ===== HEADER ===== */
        .header {
            background: white;
            padding: 14px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .left .back-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--primary);
            padding: 4px 8px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .header .left .back-btn:hover {
            background: #f1f5f9;
        }

        .header .left h1 {
            font-size: 20px;
            color: var(--primary);
            font-weight: 800;
        }

        .header .left h1 i {
            margin-left: 8px;
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--primary);
            padding: 4px;
        }

        .header .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header .actions button {
            background: none;
            border: none;
            width: 38px;
            height: 38px;
            font-size: 17px;
            cursor: pointer;
            color: #64748b;
            border-radius: 50%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header .actions button:hover {
            background: #f1f5f9;
            color: var(--primary);
        }

        .header .actions button.share:hover {
            background: #dcfce7;
            color: #25D366;
        }

        /* ===== CARDS ===== */
        .card {
            background: white;
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            border: 1px solid transparent;
            transition: border-color 0.3s ease;
        }

        .card:hover {
            border-color: var(--primary-light);
        }

        .card .card-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card .card-title .icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .card .card-title .icon.blue { background: rgba(26, 95, 122, 0.08); color: var(--primary); }
        .card .card-title .icon.green { background: rgba(5, 150, 105, 0.08); color: #059669; }
        .card .card-title .icon.purple { background: rgba(168, 85, 247, 0.08); color: #7c3aed; }
        .card .card-title .icon.orange { background: rgba(245, 158, 11, 0.08); color: #d97706; }

        .info-row {
            display: flex;
            padding: 6px 0;
            border-bottom: 1px solid #f8fafc;
            align-items: flex-start;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-row .label {
            width: 100px;
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
            flex-shrink: 0;
        }

        .info-row .value {
            flex: 1;
            font-weight: 600;
            font-size: 14px;
            text-align: left;
            color: #0f172a;
            word-break: break-word;
        }

        .highlight-box {
            background: rgba(26, 95, 122, 0.06);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border-right: 4px solid var(--primary);
        }

        .highlight-box .label {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
        }

        .highlight-box .value {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
        }

        /* ===== PAYMENT STATUS ===== */
        .payment-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            margin-top: 6px;
        }

        .payment-status.completed {
            background: rgba(5, 150, 105, 0.08);
            border: 1px solid #059669;
        }

        .payment-status.pending {
            background: rgba(220, 38, 38, 0.08);
            border: 1px solid #dc2626;
        }

        .payment-status .status-text {
            font-weight: 700;
            font-size: 15px;
        }

        .payment-status .status-text.completed { color: #059669; }
        .payment-status .status-text.pending { color: #dc2626; }

        /* ===== BUTTONS ===== */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn-group .btn {
            flex: 1;
            min-width: 120px;
            padding: 11px 16px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-group .btn:hover {
            transform: translateY(-2px);
        }

        .btn-group .btn.primary {
            background: var(--primary);
            color: white;
        }

        .btn-group .btn.primary:hover {
            background: #0f4c5c;
            box-shadow: 0 4px 16px rgba(26, 95, 122, 0.3);
        }

        .btn-group .btn.outline {
            background: transparent;
            border: 2px solid #f59e0b;
            color: #f59e0b;
        }

        .btn-group .btn.outline:hover {
            background: #fef3c7;
            box-shadow: 0 4px 16px rgba(245, 158, 11, 0.2);
        }

        /* ===== PAYMENTS LIST ===== */
        .payment-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .payment-item:last-child {
            border-bottom: none;
        }

        .payment-item .left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .payment-item .left .icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .payment-item .left .icon.payment {
            background: #dcfce7;
            color: #059669;
        }

        .payment-item .left .icon.refund {
            background: #fee2e2;
            color: #dc2626;
        }

        .payment-item .left .details .title {
            font-weight: 600;
            font-size: 14px;
            color: #0f172a;
        }

        .payment-item .left .details .note {
            font-size: 12px;
            color: #94a3b8;
        }

        .payment-item .right {
            text-align: left;
        }

        .payment-item .right .amount {
            font-weight: 700;
            font-size: 15px;
        }

        .payment-item .right .amount.payment {
            color: #059669;
        }

        .payment-item .right .amount.refund {
            color: #dc2626;
        }

        .payment-item .right .date {
            font-size: 10px;
            color: #94a3b8;
        }

        /* ===== TEETH ===== */
        .teeth-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .teeth-list .tooth {
            padding: 4px 14px;
            background: rgba(26, 95, 122, 0.06);
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            border: 1px solid rgba(26, 95, 122, 0.1);
        }

        .teeth-list .tooth.arch {
            background: rgba(168, 85, 247, 0.06);
            color: #7c3aed;
            border-color: rgba(168, 85, 247, 0.15);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 16px;
            color: #cbd5e1;
        }

        .empty-state h3 {
            font-size: 20px;
            color: #1e293b;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            color: #94a3b8;
        }

        /* ===== LOADER ===== */
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }

        .loader .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 9999;
            animation: fadeInUp 0.3s ease;
            font-family: 'Tajawal', sans-serif;
            max-width: 90%;
            text-align: center;
        }

        .toast.success { background: #16a34a; }
        .toast.error { background: #dc2626; }
        .toast.info { background: #3b82f6; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(100%);
                width: 280px;
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.show { display: block; }
            .main-content {
                margin-right: 0;
                max-width: 100%;
                padding: 16px;
            }
            .hamburger { display: block; }
            .info-row .label {
                width: 80px;
                font-size: 13px;
            }
            .info-row .value {
                font-size: 13px;
            }
            .btn-group .btn {
                font-size: 13px;
                padding: 10px 14px;
                min-width: 100px;
            }
            .header .left h1 {
                font-size: 18px;
            }
            .card {
                padding: 14px 16px;
            }
        }

        @media (max-width: 480px) {
            .main-content {
                padding: 12px;
            }
            .header {
                padding: 12px 16px;
            }
            .header .left h1 {
                font-size: 16px;
            }
            .card {
                padding: 12px 14px;
            }
            .card .card-title {
                font-size: 15px;
            }
            .info-row .label {
                width: 70px;
                font-size: 12px;
            }
            .info-row .value {
                font-size: 12px;
            }
            .btn-group .btn {
                font-size: 12px;
                padding: 8px 12px;
                min-width: 80px;
            }
            .highlight-box .value {
                font-size: 17px;
            }
            .payment-item .left .details .title {
                font-size: 13px;
            }
            .toast {
                font-size: 12px;
                padding: 10px 16px;
                bottom: 80px;
            }
        }
    </style>
</head>
<body>

<!-- ===== SIDEBAR OVERLAY ===== -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar" id="sidebar">
    <div class="logo">
        <i class="fas fa-tooth"></i> <span>Clinic</span>Pro
    </div>
    <div class="user-info">
        <div class="avatar"><i class="fas fa-user"></i></div>
        <div class="name" id="userName">طبيب الأسنان</div>
        <div class="role" id="userRole">صاحب عيادة</div>
    </div>
    <ul>
        <li onclick="navigateTo('dashboard.html')">
            <i class="fas fa-chart-pie"></i> الرئيسية
        </li>
        <li onclick="navigateTo('patients.html')">
            <i class="fas fa-users"></i> المرضى
        </li>
        <li onclick="navigateTo('treatments.html')">
            <i class="fas fa-tooth"></i> المعالجات
        </li>
        <li onclick="navigateTo('services.html')">
            <i class="fas fa-list"></i> الخدمات
        </li>
        <li onclick="navigateTo('doctors.html')">
            <i class="fas fa-user-md"></i> الأطباء
        </li>
        <li onclick="navigateTo('secretaries.html')">
            <i class="fas fa-user-tie"></i> السكرتيرات
        </li>
        <li onclick="navigateTo('lab.html')">
            <i class="fas fa-flask"></i> المعمل
        </li>
        <li onclick="navigateTo('reports.html')">
            <i class="fas fa-chart-bar"></i> التقارير
        </li>
        <li onclick="navigateTo('notifications.html')">
            <i class="fas fa-bell"></i> الإشعارات
        </li>
        <li onclick="navigateTo('settings.html')">
            <i class="fas fa-cog"></i> الإعدادات
        </li>
        <li onclick="navigateTo('profile.html')">
            <i class="fas fa-user-circle"></i> الملف الشخصي
        </li>
        <li onclick="navigateTo('subscription-plans.html')">
            <i class="fas fa-crown"></i> باقات الاشتراك
        </li>
        <li class="logout" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> تسجيل خروج
        </li>
    </ul>
</div>

<!-- ===== MAIN CONTENT ===== -->
<div class="main-content">
    <!-- ===== HEADER ===== -->
    <div class="header">
        <div class="left">
            <button class="hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-right"></i></button>
            <h1><i class="fas fa-notes-medical"></i> تفاصيل المعالجة</h1>
        </div>
        <div class="actions">
            <button class="share" onclick="shareWhatsApp()" title="مشاركة عبر واتساب">
                <i class="fab fa-whatsapp"></i>
            </button>
        </div>
    </div>

    <!-- ===== CONTENT ===== -->
    <div id="detailsContent">
        <div class="loader"><div class="spinner"></div></div>
    </div>
</div>

<script>
// ============================================
// ✅ الإعدادات الأساسية
// ============================================
const API_BASE = 'https://clinicprosystem.koyeb.app/api';
let token = localStorage.getItem('token') || '';
let userData = JSON.parse(localStorage.getItem('user') || '{}');

// ✅ الحصول على treatmentId من URL
const urlParams = new URLSearchParams(window.location.search);
const treatmentId = urlParams.get('id') || '';

let treatment = null;
let paidAmount = 0;
let remainingAmount = 0;
let payments = [];

// ============================================
// ✅ دوال API
// ============================================
async function apiCall(endpoint, method = 'GET', body = null) {
    const headers = {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
    };
    if (token) headers['Authorization'] = `Bearer ${token}`;

    const options = { method, headers };
    if (body) options.body = JSON.stringify(body);

    try {
        const response = await fetch(`${API_BASE}${endpoint}`, options);
        if (response.status === 401) {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
            return null;
        }
        return await response.json();
    } catch (e) {
        console.error('❌ API Error:', e);
        return null;
    }
}

// ============================================
// ✅ التنقل
// ============================================
function navigateTo(page) {
    if (window.innerWidth <= 768) toggleSidebar(false);
    window.location.href = page;
}

function goBack() {
    window.location.href = 'treatments.html';
}

function toggleSidebar(forceState) {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    if (typeof forceState === 'boolean') {
        sidebar.classList.toggle('open', forceState);
        overlay.classList.toggle('show', forceState);
    } else {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
    }
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'index.html';
}

// ============================================
// ✅ عرض رسائل
// ============================================
function showToast(message, type = 'info') {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;
    document.body.appendChild(toast);

    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// ============================================
// ✅ تحميل تفاصيل المعالجة
// ============================================
async function loadTreatmentDetails() {
    if (!treatmentId) {
        document.getElementById('detailsContent').innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>
                <h3>لم يتم تحديد معالجة</h3>
                <p>يرجى العودة إلى صفحة المعالجات</p>
                <button onclick="goBack()" style="margin-top:16px;padding:10px 32px;background:var(--primary);color:white;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;">
                    <i class="fas fa-arrow-right"></i> العودة
                </button>
            </div>
        `;
        return;
    }

    const container = document.getElementById('detailsContent');
    container.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

    try {
        // ✅ جلب تفاصيل المعالجة
        const response = await apiCall(`/treatments/${treatmentId}`);
        console.log('📡 رد السيرفر:', response);

        if (response?.success && response?.treatment) {
            treatment = response.treatment;
            
            // ✅ جلب حالة الدفع
            const paymentStatus = await apiCall(`/treatments/${treatmentId}/payment-status`);
            if (paymentStatus?.success) {
                paidAmount = paymentStatus.paid || 0;
                remainingAmount = paymentStatus.remaining || 0;
            }
            
            // ✅ جلب سجل المدفوعات
            const paymentsRes = await apiCall(`/treatments/${treatmentId}/payments`);
            if (paymentsRes?.success) {
                payments = paymentsRes.payments || [];
            }
            
            renderDetails();
        } else {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>
                    <h3>المعالجة غير موجودة</h3>
                    <p>لم يتم العثور على هذه المعالجة</p>
                    <button onclick="goBack()" style="margin-top:16px;padding:10px 32px;background:var(--primary);color:white;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;">
                        <i class="fas fa-arrow-right"></i> العودة
                    </button>
                </div>
            `;
        }
    } catch (error) {
        console.error('❌ Error loading treatment:', error);
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>
                <h3>حدث خطأ</h3>
                <p>فشل في تحميل بيانات المعالجة</p>
                <button onclick="loadTreatmentDetails()" style="margin-top:16px;padding:10px 32px;background:var(--primary);color:white;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;">
                    <i class="fas fa-sync-alt"></i> إعادة المحاولة
                </button>
            </div>
        `;
    }
}

// ============================================
// ✅ عرض التفاصيل
// ============================================
function renderDetails() {
    const container = document.getElementById('detailsContent');
    if (!treatment) return;

    const t = treatment;
    const serviceName = t.subServiceName || t.serviceName || 'غير محدد';
    const mainServiceName = t.mainServiceName || '';
    const doctorName = t.doctorName || 'الطبيب';
    const originalPrice = t.originalPrice || 0;
    const discount = t.discount || 0;
    const finalPrice = t.finalPrice || originalPrice;
    const date = t.date ? t.date.substring(0, 10) : 'غير محدد';
    const patientName = t.patientName || t.patient?.name || 'غير محدد';

    const teeth = t.teeth || t.teethDetails || [];
    const archType = t.archType || t.jawDetails?.jawType || '';
    const notes = t.notes || t.additionalNotes || '';

    // ✅ الأسنان
    let teethHtml = '';
    if (teeth.length > 0) {
        teethHtml = `
            <div class="teeth-list">
                ${teeth.map(tooth => {
                    const num = tooth.number || tooth || '';
                    const jaw = tooth.jaw || '';
                    const side = tooth.side || '';
                    let label = `السن ${num}`;
                    if (jaw || side) label += ` (${jaw} ${side})`;
                    return `<span class="tooth">${label}</span>`;
                }).join('')}
            </div>
        `;
    }

    // ✅ نوع الفك
    let archHtml = '';
    if (archType) {
        archHtml = `
            <div class="teeth-list" style="margin-top:8px;">
                <span class="tooth arch"><i class="fas fa-archway"></i> ${archType}</span>
            </div>
        `;
    }

    // ✅ حالة الدفع
    const isPaid = remainingAmount <= 0;
    const statusClass = isPaid ? 'completed' : 'pending';
    const statusText = isPaid ? '✅ مدفوع بالكامل' : `⚠️ متبقي ${remainingAmount} ريال`;

    // ✅ المدفوعات
    let paymentsHtml = '';
    if (payments.length > 0) {
        paymentsHtml = `
            <div class="card">
                <div class="card-title">
                    <span class="icon purple"><i class="fas fa-history"></i></span>
                    سجل المدفوعات
                </div>
                ${payments.map(p => {
                    const isPayment = p.type === 'payment';
                    return `
                        <div class="payment-item">
                            <div class="left">
                                <span class="icon ${isPayment ? 'payment' : 'refund'}">
                                    <i class="fas ${isPayment ? 'fa-arrow-up' : 'fa-arrow-down'}"></i>
                                </span>
                                <div class="details">
                                    <div class="title">${isPayment ? 'دفعة' : 'عودة'}</div>
                                    <div class="note">${p.note || 'لا توجد تفاصيل'}</div>
                                </div>
                            </div>
                            <div class="right">
                                <div class="amount ${isPayment ? 'payment' : 'refund'}">${isPayment ? '+' : '-'}${p.amount} ريال</div>
                                <div class="date">${p.date ? p.date.substring(0, 10) : ''}</div>
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    }

    container.innerHTML = `
        <!-- ===== معلومات عامة ===== -->
        <div class="card">
            <div class="card-title">
                <span class="icon blue"><i class="fas fa-info-circle"></i></span>
                معلومات عامة
            </div>
            <div class="info-row">
                <span class="label">المريض</span>
                <span class="value">${patientName}</span>
            </div>
            ${mainServiceName ? `
                <div class="info-row">
                    <span class="label">الخدمة الرئيسية</span>
                    <span class="value">${mainServiceName}</span>
                </div>
            ` : ''}
            <div class="info-row">
                <span class="label">المعالجة</span>
                <span class="value">${serviceName}</span>
            </div>
            <div class="info-row">
                <span class="label">الطبيب</span>
                <span class="value">${doctorName}</span>
            </div>
            <div class="info-row">
                <span class="label">التاريخ</span>
                <span class="value">${date}</span>
            </div>
        </div>

        <!-- ===== المالية ===== -->
        <div class="card">
            <div class="card-title">
                <span class="icon green"><i class="fas fa-coins"></i></span>
                المالية
            </div>
            <div class="info-row">
                <span class="label">السعر الأصلي</span>
                <span class="value">${originalPrice} ريال</span>
            </div>
            ${discount > 0 ? `
                <div class="info-row">
                    <span class="label">الخصم</span>
                    <span class="value" style="color:#dc2626;">-${discount} ريال</span>
                </div>
            ` : ''}
            <div class="highlight-box">
                <span class="label">المبلغ النهائي</span>
                <span class="value">${finalPrice} ريال</span>
            </div>
        </div>

        <!-- ===== حالة الدفع ===== -->
        <div class="card">
            <div class="card-title">
                <span class="icon purple"><i class="fas fa-credit-card"></i></span>
                حالة الدفع
            </div>
            <div class="info-row">
                <span class="label">السعر الإجمالي</span>
                <span class="value">${finalPrice} ريال</span>
            </div>
            <div class="info-row">
                <span class="label">المدفوع</span>
                <span class="value" style="color:#059669;font-weight:700;">${paidAmount} ريال</span>
            </div>
            <div class="info-row">
                <span class="label">المتبقي</span>
                <span class="value" style="color:${isPaid ? '#059669' : '#dc2626'};font-weight:700;">${remainingAmount} ريال</span>
            </div>
            <div class="payment-status ${statusClass}">
                <span class="status-text ${statusClass}">${statusText}</span>
            </div>

            <div class="btn-group">
                <button class="btn primary" onclick="addPayment()">
                    <i class="fas fa-plus-circle"></i> إضافة دفعة
                </button>
                <button class="btn outline" onclick="addRefund()">
                    <i class="fas fa-undo-alt"></i> إضافة عودة
                </button>
            </div>
        </div>

        ${paymentsHtml}

        <!-- ===== الأسنان ===== -->
        ${(teeth.length > 0 || archType) ? `
            <div class="card">
                <div class="card-title">
                    <span class="icon orange"><i class="fas fa-tooth"></i></span>
                    تفاصيل الأسنان
                </div>
                ${teethHtml}
                ${archHtml}
                ${t.numberOfTeeth ? `
                    <div style="margin-top:8px;font-size:13px;color:#64748b;">
                        <i class="fas fa-hashtag"></i> عدد الأسنان المعالجة: ${t.numberOfTeeth}
                    </div>
                ` : ''}
            </div>
        ` : ''}

        <!-- ===== الملاحظات ===== -->
        ${notes ? `
            <div class="card">
                <div class="card-title">
                    <span class="icon blue"><i class="fas fa-note-sticky"></i></span>
                    ملاحظات
                </div>
                <div class="info-row">
                    <span class="label">الملاحظات</span>
                    <span class="value">${notes}</span>
                </div>
            </div>
        ` : ''}
    `;
}

// ============================================
// ✅ إضافة دفعة
// ============================================
async function addPayment() {
    if (!treatmentId) {
        showToast('⚠️ لا توجد معالجة محددة', 'error');
        return;
    }

    const amountInput = prompt('💳 أدخل المبلغ الذي تريد إضافته:', '');
    if (amountInput === null) return;

    const amount = parseInt(amountInput);
    if (isNaN(amount) || amount <= 0) {
        showToast('⚠️ الرجاء إدخال مبلغ صحيح', 'error');
        return;
    }

    if (amount > remainingAmount) {
        showToast(`⚠️ المبلغ المطلوب (${amount} ريال) يتجاوز المتبقي (${remainingAmount} ريال)`, 'error');
        return;
    }

    try {
        const response = await apiCall(`/treatments/${treatmentId}/payment`, 'POST', {
            amount: amount,
            type: 'payment',
            note: 'دفعة إضافية'
        });

        if (response?.success) {
            showToast('✅ تم إضافة الدفعة بنجاح', 'success');
            loadTreatmentDetails();
        } else {
            showToast('❌ فشل في إضافة الدفعة: ' + (response?.error || 'خطأ غير معروف'), 'error');
        }
    } catch (error) {
        console.error('❌ Error adding payment:', error);
        showToast('❌ حدث خطأ: ' + (error.message || 'فشل إضافة الدفعة'), 'error');
    }
}

// ============================================
// ✅ إضافة عودة
// ============================================
async function addRefund() {
    if (!treatmentId) {
        showToast('⚠️ لا توجد معالجة محددة', 'error');
        return;
    }

    if (paidAmount <= 0) {
        showToast('⚠️ لا يوجد مبلغ مدفوع لإرجاعه', 'error');
        return;
    }

    const amountInput = prompt('🔄 أدخل المبلغ الذي تريد إرجاعه:', '');
    if (amountInput === null) return;

    const amount = parseInt(amountInput);
    if (isNaN(amount) || amount <= 0) {
        showToast('⚠️ الرجاء إدخال مبلغ صحيح', 'error');
        return;
    }

    if (amount > paidAmount) {
        showToast(`⚠️ المبلغ المطلوب (${amount} ريال) يتجاوز المدفوع (${paidAmount} ريال)`, 'error');
        return;
    }

    try {
        const response = await apiCall(`/treatments/${treatmentId}/payment`, 'POST', {
            amount: amount,
            type: 'refund',
            note: 'عودة مبلغ'
        });

        if (response?.success) {
            showToast('✅ تم إضافة العودة بنجاح', 'success');
            loadTreatmentDetails();
        } else {
            showToast('❌ فشل في إضافة العودة: ' + (response?.error || 'خطأ غير معروف'), 'error');
        }
    } catch (error) {
        console.error('❌ Error adding refund:', error);
        showToast('❌ حدث خطأ: ' + (error.message || 'فشل إضافة العودة'), 'error');
    }
}

// ============================================
// ✅ مشاركة عبر واتساب
// ============================================
async function shareWhatsApp() {
    if (!treatment) {
        showToast('⚠️ لا توجد بيانات للمشاركة', 'error');
        return;
    }

    const t = treatment;
    const serviceName = t.subServiceName || t.serviceName || 'معالجة';
    const mainServiceName = t.mainServiceName || '';
    const patientName = t.patientName || t.patient?.name || 'مريض';
    const doctorName = t.doctorName || 'طبيب';
    const originalPrice = t.originalPrice || 0;
    const discount = t.discount || 0;
    const finalPrice = t.finalPrice || originalPrice;
    const date = t.date ? t.date.substring(0, 10) : '';
    const notes = t.notes || t.additionalNotes || '';
    const teeth = t.teeth || t.teethDetails || [];
    const archType = t.archType || t.jawDetails?.jawType || '';

    // بناء رسالة واتساب
    let message = `*📋 تفاصيل المعالجة*\n\n`;
    message += `🏥 العيادة: عيادتنا\n`;
    message += `👤 المريض: ${patientName}\n`;
    if (mainServiceName) message += `🦷 الخدمة الرئيسية: ${mainServiceName}\n`;
    message += `⚕️ المعالجة: ${serviceName}\n`;
    message += `👨‍⚕️ الطبيب: ${doctorName}\n`;
    message += `📅 التاريخ: ${date}\n\n`;
    message += `💰 السعر الأصلي: ${originalPrice} ريال\n`;
    if (discount > 0) message += `🏷️ الخصم: ${discount} ريال\n`;
    message += `💵 المبلغ النهائي: ${finalPrice} ريال\n`;
    message += `💳 المدفوع: ${paidAmount} ريال\n`;
    message += `📊 المتبقي: ${remainingAmount} ريال\n`;

    // الأسنان
    if (teeth.length > 0) {
        message += `\n🦷 الأسنان المعالجة:\n`;
        teeth.forEach(tooth => {
            const num = tooth.number || tooth || '';
            const jaw = tooth.jaw || '';
            const side = tooth.side || '';
            let label = `سن ${num}`;
            if (jaw || side) label += ` (${jaw} ${side})`;
            message += `  • ${label}\n`;
        });
    }

    // نوع الفك
    if (archType) {
        message += `\n🦷 نوع الفك: ${archType}\n`;
    }

    // عدد الأسنان
    if (t.numberOfTeeth) {
        message += `\n🔢 عدد الأسنان المعالجة: ${t.numberOfTeeth}\n`;
    }

    // الملاحظات
    if (notes) {
        message += `\n📝 ملاحظات: ${notes}\n`;
    }

    message += `\n━━━━━━━━━━━━━━━━━━━━\n`;
    message += `📱 تم الإرسال من تطبيق عيادتي\n`;
    message += `شكراً لثقتكم بنا 🤝`;

    // جلب رقم الهاتف
    let phone = t.patientPhone || t.phone || '';
    if (!phone && t.patient) {
        phone = t.patient.phone || '';
    }
    phone = phone.replace(/\s/g, '').replace('+', '');

    if (!phone) {
        showToast('⚠️ رقم المريض غير متوفر للمشاركة', 'error');
        return;
    }

    const encoded = encodeURIComponent(message);
    const whatsappUrl = `https://wa.me/${phone}?text=${encoded}`;
    window.open(whatsappUrl, '_blank');
}
