<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicPro - إنشاء حساب</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

        .signup-container {
            width: 100%; max-width: 480px; background: white; border-radius: 24px;
            padding: 32px 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center; margin-bottom: 24px;
        }
        .logo .icon {
            width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 10px;
            background: rgba(26,95,122,0.1); display: flex; align-items: center; justify-content: center;
            font-size: 30px; color: #1A5F7A;
        }
        .logo h1 { font-size: 22px; color: #1A5F7A; }
        .logo p { font-size: 14px; color: #64748b; }

        .section-title {
            font-size: 16px; font-weight: 700; color: #1A5F7A; margin: 16px 0 10px 0;
            display: flex; align-items: center; gap: 8px;
        }
        .section-title i { font-size: 14px; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: 700; font-size: 13px; color: #1e293b; margin-bottom: 4px; }
        .form-group .required { color: #ef4444; }

        .form-control {
            width: 100%; padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 12px;
            font-size: 14px; transition: border-color 0.3s; text-align: right;
        }
        .form-control:focus { border-color: #1A5F7A; outline: none; }
        .form-control:disabled { background: #f1f5f9; }

        .input-row { display: flex; gap: 8px; align-items: center; }
        .country-select {
            padding: 10px 8px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 14px;
            background: white; min-width: 70px; text-align: center;
        }
        .country-select:focus { border-color: #1A5F7A; outline: none; }
        .input-row .form-control { flex: 1; }

        .password-wrapper { position: relative; }
        .password-wrapper .form-control { padding-left: 46px; }
        .password-wrapper .toggle {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; font-size: 18px; cursor: pointer; color: #94a3b8;
        }

        .btn-submit {
            width: 100%; padding: 14px; background: #57C0E8; color: white; border: none;
            border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer;
            transition: background 0.3s; margin-top: 8px;
        }
        .btn-submit:hover { background: #4aadcc; }
        .btn-submit:disabled { background: #b0d4e0; cursor: not-allowed; }
        .btn-submit .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .login-link { text-align: center; margin-top: 16px; font-size: 14px; color: #64748b; }
        .login-link a { color: #1A5F7A; text-decoration: none; font-weight: 700; cursor: pointer; }

        .error-message {
            background: #fee2e2; color: #dc2626; padding: 10px 14px; border-radius: 10px;
            font-size: 14px; margin-bottom: 12px; display: none; text-align: center;
        }
        .error-message.show { display: block; }

        @media (max-width: 480px) {
            .signup-container { padding: 20px 16px; }
        }
    </style>
</head>
<body>

<div class="signup-container">
    <div class="logo">
        <div class="icon">🏥</div>
        <h1>ClinicPro</h1>
        <p>نظام إدارة العيادة</p>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <!-- بيانات العيادة -->
    <div class="section-title"><i class="fas fa-clinic-medical"></i> بيانات العيادة</div>

    <div class="form-group">
        <label>اسم العيادة <span class="required">*</span></label>
        <input class="form-control" id="clinicName" placeholder="مثال: عيادة الابتسامة">
    </div>

    <div class="form-group">
        <label>اسم صاحب العيادة <span class="required">*</span></label>
        <input class="form-control" id="ownerName" placeholder="الاسم الكامل">
    </div>

    <div class="form-group">
        <label>رقم الجوال <span class="required">*</span></label>
        <div class="input-row">
            <select class="country-select" id="countryCode">
                <option value="+967">🇾🇪 +967</option>
                <option value="+966">🇸🇦 +966</option>
                <option value="+20">🇪🇬 +20</option>
                <option value="+971">🇦🇪 +971</option>
                <option value="+965">🇰🇼 +965</option>
                <option value="+974">🇶🇦 +974</option>
                <option value="+973">🇧🇭 +973</option>
                <option value="+968">🇴🇲 +968</option>
                <option value="+962">🇯🇴 +962</option>
            </select>
            <input class="form-control" id="phone" placeholder="7xxxxxxxx" dir="ltr" style="text-align:left;">
        </div>
    </div>

    <!-- كلمة السر -->
    <div class="section-title"><i class="fas fa-lock"></i> كلمة السر</div>

    <div class="form-group">
        <label>كلمة السر <span class="required">*</span></label>
        <div class="password-wrapper">
            <input class="form-control" id="password" type="password" placeholder="****" dir="ltr">
            <button class="toggle" onclick="togglePassword('password', this)">👁️</button>
        </div>
        <div style="font-size:11px;color:#94a3b8;margin-top:4px;">يجب أن تكون 6 أحرف على الأقل</div>
    </div>

    <div class="form-group">
        <label>تأكيد كلمة السر <span class="required">*</span></label>
        <div class="password-wrapper">
            <input class="form-control" id="confirmPassword" type="password" placeholder="****" dir="ltr">
            <button class="toggle" onclick="togglePassword('confirmPassword', this)">👁️</button>
        </div>
    </div>

    <button class="btn-submit" id="signupBtn" onclick="signup()">
        إنشاء حساب
    </button>

    <div class="login-link">
        لديك حساب بالفعل؟ <a onclick="goToLogin()">تسجيل الدخول</a>
    </div>
</div>

<script>
// ============================================
// ✅ الإعدادات الأساسية
// ============================================
const API_BASE = 'https://marginal-addi-1realitylotter1-37028393.koyeb.app/api';

// ============================================
// ✅ دوال API
// ============================================
async function apiCall(endpoint, method = 'POST', body = null) {
    const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
    const options = { method, headers };
    if (body) options.body = JSON.stringify(body);
    try {
        const response = await fetch(`${API_BASE}${endpoint}`, options);
        return await response.json();
    } catch (e) { console.error('❌ API Error:', e); return { success: false, error: 'فشل الاتصال' }; }
}

// ============================================
// ✅ دوال المساعدة
// ============================================
function togglePassword(id, btn) {
    const input = document.getElementById(id);
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '👁️‍🗨️';
    } else {
        input.type = 'password';
        btn.textContent = '👁️';
    }
}

function showError(msg) {
    const el = document.getElementById('errorMessage');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 5000);
}

// ============================================
// ✅ إنشاء الحساب
// ============================================
async function signup() {
    const clinicName = document.getElementById('clinicName').value.trim();
    const ownerName = document.getElementById('ownerName').value.trim();
    const countryCode = document.getElementById('countryCode').value;
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    const errorEl = document.getElementById('errorMessage');
    errorEl.classList.remove('show');

    // ✅ التحقق من صحة الإدخال
    if (!clinicName) { showError('الرجاء إدخال اسم العيادة'); return; }
    if (!ownerName) { showError('الرجاء إدخال اسم صاحب العيادة'); return; }
    if (!phone || phone.length < 9) { showError('الرجاء إدخال رقم جوال صحيح'); return; }
    if (!password || password.length < 6) { showError('كلمة السر يجب أن تكون 6 أحرف على الأقل'); return; }
    if (password !== confirmPassword) { showError('كلمة السر غير متطابقة'); return; }

    const fullPhone = countryCode + phone;

    const btn = document.getElementById('signupBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> جاري إنشاء الحساب...';

    try {
        const response = await apiCall('/auth/register', 'POST', {
            clinicName: clinicName,
            ownerName: ownerName,
            phone: fullPhone,
            password: password
        });

        if (response.success) {
            localStorage.setItem('token', response.token);
            if (response.user) {
                localStorage.setItem('user', JSON.stringify(response.user));
            }
            alert('✅ تم إنشاء الحساب بنجاح!');
            window.location.href = 'dashboard.html';
        } else {
            showError(response.error || '❌ فشل إنشاء الحساب. الرقم قد يكون مسجلاً مسبقاً');
            btn.disabled = false;
            btn.innerHTML = 'إنشاء حساب';
        }
    } catch (e) {
        showError('❌ فشل الاتصال بالسيرفر');
        btn.disabled = false;
        btn.innerHTML = 'إنشاء حساب';
    }
}

// ============================================
// ✅ التنقل
// ============================================
function goToLogin() {
    window.location.href = 'index.html';
}

// ============================================
// ✅ الضغط على Enter
// ============================================
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') signup();
});
</script>

</body>
</html>
