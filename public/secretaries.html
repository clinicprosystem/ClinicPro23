<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>ClinicPro - السكرتيرات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: #f0f4f8;
            min-height: 100vh;
        }

        :root {
            --primary: #1A5F7A;
            --primary-light: #57C0E8;
            --secondary: #57C0E8;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --radius: 16px;
            --sidebar-width: 270px;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 10px; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--primary);
            color: white;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            box-shadow: -4px 0 20px rgba(0,0,0,0.1);
        }

        .sidebar .logo {
            padding: 24px 20px 16px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .sidebar .logo span { color: var(--primary-light); }
        .sidebar .logo i { margin-left: 8px; }

        .sidebar .user-info {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        .sidebar .user-info .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 8px;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .sidebar .user-info .name {
            font-weight: 700;
            font-size: 16px;
        }

        .sidebar .user-info .role {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin-top: 2px;
        }

        .sidebar ul {
            list-style: none;
            padding: 8px 0;
        }

        .sidebar ul li {
            padding: 11px 24px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 14px;
            border-right: 3px solid transparent;
            font-size: 14px;
        }

        .sidebar ul li:hover {
            background: rgba(255,255,255,0.06);
            border-right-color: rgba(255,255,255,0.3);
        }

        .sidebar ul li.active {
            background: rgba(255,255,255,0.1);
            border-right-color: var(--primary-light);
        }

        .sidebar ul li i {
            width: 20px;
            text-align: center;
            font-size: 16px;
            color: rgba(255,255,255,0.7);
        }

        .sidebar ul li.logout {
            color: #fca5a5;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 16px;
        }

        .sidebar ul li.logout:hover {
            background: rgba(239, 68, 68, 0.12);
            border-right-color: #ef4444;
        }

        .sidebar ul li.logout i { color: #fca5a5; }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 999;
            backdrop-filter: blur(2px);
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-right: var(--sidebar-width);
            padding: 20px 24px;
            min-height: 100vh;
            max-width: calc(100% - var(--sidebar-width));
        }

        /* ===== HEADER ===== */
        .header {
            background: white;
            padding: 14px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .left h1 {
            font-size: 20px;
            color: var(--primary);
            font-weight: 800;
        }

        .header .left h1 i {
            margin-left: 8px;
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--primary);
            padding: 4px;
        }

        .header .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header .actions button {
            background: none;
            border: none;
            width: 38px;
            height: 38px;
            font-size: 17px;
            cursor: pointer;
            color: #64748b;
            border-radius: 50%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header .actions button:hover {
            background: #f1f5f9;
            color: var(--primary);
        }

        /* ===== SECRETARY CARD ===== */
        .secretary-card {
            background: white;
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.25s ease;
            border: 1px solid transparent;
        }

        .secretary-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            border-color: var(--primary-light);
        }

        .secretary-card .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(26, 95, 122, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: var(--primary);
            flex-shrink: 0;
        }

        .secretary-card .info {
            flex: 1;
            min-width: 0;
        }

        .secretary-card .info .name {
            font-weight: 800;
            font-size: 16px;
            color: #0f172a;
        }

        .secretary-card .info .phone {
            font-size: 13px;
            color: #64748b;
            margin-top: 2px;
        }

        .secretary-card .info .phone i {
            margin-left: 4px;
            color: #94a3b8;
        }

        .secretary-card .info .password {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .secretary-card .info .password i {
            font-size: 11px;
            color: #94a3b8;
        }

        .secretary-card .actions {
            display: flex;
            gap: 4px;
        }

        .secretary-card .actions button {
            background: none;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
            color: #64748b;
        }

        .secretary-card .actions button:hover {
            background: #f1f5f9;
            transform: scale(1.05);
        }

        .secretary-card .actions button.delete:hover {
            background: #fee2e2;
            color: #ef4444;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 16px;
            color: #cbd5e1;
        }

        .empty-state h3 {
            font-size: 20px;
            color: #1e293b;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            color: #94a3b8;
        }

        .empty-state .retry-btn {
            margin-top: 16px;
            padding: 10px 32px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .empty-state .retry-btn:hover {
            background: #0f4c5c;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(26, 95, 122, 0.3);
        }

        /* ===== LOADER ===== */
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }

        .loader .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== FAB ===== */
        .fab {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #57C0E8, #4aadcc);
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(87, 192, 232, 0.4);
            transition: all 0.3s ease;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab:hover {
            transform: scale(1.08) rotate(90deg);
            box-shadow: 0 6px 32px rgba(87, 192, 232, 0.5);
        }

        .fab:active {
            transform: scale(0.95);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 9999;
            animation: fadeInUp 0.3s ease;
            font-family: 'Tajawal', sans-serif;
            max-width: 90%;
            text-align: center;
        }

        .toast.success { background: #16a34a; }
        .toast.error { background: #dc2626; }
        .toast.info { background: #3b82f6; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(100%);
                width: 280px;
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.show { display: block; }
            .main-content {
                margin-right: 0;
                max-width: 100%;
                padding: 16px;
            }
            .hamburger { display: block; }
            .secretary-card {
                flex-wrap: wrap;
                padding: 14px 16px;
            }
            .secretary-card .info {
                flex: 1 1 100%;
                order: 2;
            }
            .secretary-card .avatar {
                order: 1;
            }
            .secretary-card .actions {
                order: 3;
                flex: 1 1 100%;
                justify-content: flex-start;
            }
            .fab {
                bottom: 20px;
                left: 20px;
                width: 52px;
                height: 52px;
                font-size: 24px;
            }
            .header .left h1 {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .main-content {
                padding: 12px;
            }
            .header {
                padding: 12px 16px;
            }
            .header .left h1 {
                font-size: 16px;
            }
            .secretary-card .info .name {
                font-size: 14px;
            }
            .fab {
                bottom: 16px;
                left: 16px;
                width: 48px;
                height: 48px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

<!-- ===== SIDEBAR OVERLAY ===== -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar" id="sidebar">
    <div class="logo">
        <i class="fas fa-tooth"></i> <span>Clinic</span>Pro
    </div>
    <div class="user-info">
        <div class="avatar"><i class="fas fa-user"></i></div>
        <div class="name" id="userName">طبيب الأسنان</div>
        <div class="role" id="userRole">صاحب عيادة</div>
    </div>
    <ul>
        <li onclick="navigateTo('dashboard.html')">
            <i class="fas fa-chart-pie"></i> الرئيسية
        </li>
        <li onclick="navigateTo('patients.html')">
            <i class="fas fa-users"></i> المرضى
        </li>
        <li onclick="navigateTo('treatments.html')">
            <i class="fas fa-tooth"></i> المعالجات
        </li>
        <li onclick="navigateTo('services.html')">
            <i class="fas fa-list"></i> الخدمات
        </li>
        <li onclick="navigateTo('doctors.html')">
            <i class="fas fa-user-md"></i> الأطباء
        </li>
        <li class="active">
            <i class="fas fa-user-tie"></i> السكرتيرات
        </li>
        <li onclick="navigateTo('lab.html')">
            <i class="fas fa-flask"></i> المعمل
        </li>
        <li onclick="navigateTo('reports.html')">
            <i class="fas fa-chart-bar"></i> التقارير
        </li>
        <li onclick="navigateTo('notifications.html')">
            <i class="fas fa-bell"></i> الإشعارات
        </li>
        <li onclick="navigateTo('settings.html')">
            <i class="fas fa-cog"></i> الإعدادات
        </li>
        <li onclick="navigateTo('profile.html')">
            <i class="fas fa-user-circle"></i> الملف الشخصي
        </li>
        <li onclick="navigateTo('subscription-plans.html')">
            <i class="fas fa-crown"></i> باقات الاشتراك
        </li>
        <li class="logout" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> تسجيل خروج
        </li>
    </ul>
</div>

<!-- ===== MAIN CONTENT ===== -->
<div class="main-content">
    <!-- ===== HEADER ===== -->
    <div class="header">
        <div class="left">
            <button class="hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <h1><i class="fas fa-user-tie"></i> السكرتيرات</h1>
        </div>
        <div class="actions">
            <button onclick="loadSecretaries()" title="تحديث البيانات">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>

    <!-- ===== SECRETARIES LIST ===== -->
    <div id="secretariesList">
        <div class="loader"><div class="spinner"></div></div>
    </div>
</div>

<!-- ===== FAB ===== -->
<button class="fab" onclick="addSecretary()">
    <i class="fas fa-plus"></i>
</button>

<script>
// ============================================
// ✅ الإعدادات الأساسية
// ============================================
const API_BASE = 'https://clinicprosystem.koyeb.app/api';
let token = localStorage.getItem('token') || '';
let userData = JSON.parse(localStorage.getItem('user') || '{}');
let secretaries = [];
let isLoading = false;

// ============================================
// ✅ دوال API
// ============================================
async function apiCall(endpoint, method = 'GET', body = null) {
    const headers = {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
    };
    if (token) headers['Authorization'] = `Bearer ${token}`;

    const options = { method, headers };
    if (body) options.body = JSON.stringify(body);

    try {
        const response = await fetch(`${API_BASE}${endpoint}`, options);
        if (response.status === 401) {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
            return null;
        }
        return await response.json();
    } catch (e) {
        console.error('❌ API Error:', e);
        return null;
    }
}

// ============================================
// ✅ التنقل
// ============================================
function navigateTo(page) {
    if (window.innerWidth <= 768) toggleSidebar(false);
    window.location.href = page;
}

function toggleSidebar(forceState) {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    if (typeof forceState === 'boolean') {
        sidebar.classList.toggle('open', forceState);
        overlay.classList.toggle('show', forceState);
    } else {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
    }
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'index.html';
}

// ============================================
// ✅ عرض الرسائل
// ============================================
function showToast(message, type = 'info') {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;
    document.body.appendChild(toast);

    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// ============================================
// ✅ تحميل السكرتيرات
// ============================================
async function loadSecretaries() {
    if (isLoading) return;
    isLoading = true;

    const list = document.getElementById('secretariesList');
    list.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

    try {
        const response = await apiCall('/clinics/secretaries');
        
        if (response?.secretaries) {
            secretaries = response.secretaries;
            renderSecretaries();
            isLoading = false;
            return;
        }
        
        // ✅ إذا فشل جلب البيانات
        list.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>
                <h3>فشل في تحميل البيانات</h3>
                <p>يرجى التحقق من اتصالك بالإنترنت</p>
                <button class="retry-btn" onclick="loadSecretaries()">
                    <i class="fas fa-sync-alt"></i> إعادة المحاولة
                </button>
            </div>
        `;
        isLoading = false;

    } catch (error) {
        console.error('❌ Error loading secretaries:', error);
        list.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>
                <h3>حدث خطأ</h3>
                <p>فشل في تحميل بيانات السكرتيرات</p>
                <button class="retry-btn" onclick="loadSecretaries()">
                    <i class="fas fa-sync-alt"></i> إعادة المحاولة
                </button>
            </div>
        `;
        isLoading = false;
    }
}

// ============================================
// ✅ عرض السكرتيرات
// ============================================
function renderSecretaries() {
    const list = document.getElementById('secretariesList');

    if (secretaries.length === 0) {
        list.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-user-tie"></i>
                <h3>لا توجد سكرتيرات</h3>
                <p>اضغط على زر + لإضافة سكرتيرة جديدة</p>
            </div>
        `;
        return;
    }

    list.innerHTML = secretaries.map(s => {
        const id = s._id || s.id || '';
        const name = s.name || 'غير محدد';
        const phone = s.phone || '-';
        const tempPassword = s.tempPassword || '••••••••';

        return `
            <div class="secretary-card">
                <div class="avatar"><i class="fas fa-user-tie"></i></div>
                <div class="info">
                    <div class="name">${name}</div>
                    <div class="phone"><i class="fas fa-phone"></i> ${phone}</div>
                    <div class="password"><i class="fas fa-key"></i> كلمة السر: ${tempPassword}</div>
                </div>
                <div class="actions">
                    <button class="delete" onclick="deleteSecretary('${id}','${name}')" title="حذف">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
        `;
    }).join('');
}

// ============================================
// ✅ إضافة سكرتير جديد
// ============================================
async function addSecretary() {
    // ✅ الانتقال إلى صفحة إضافة سكرتير
    window.location.href = 'add-secretary.html';
}

// ============================================
// ✅ حذف سكرتير
// ============================================
async function deleteSecretary(id, name) {
    if (!id) {
        showToast('⚠️ لا يمكن حذف هذا السكرتير', 'error');
        return;
    }

    if (!confirm(`🗑️ هل أنت متأكد من حذف السكرتير "${name}"؟`)) return;

    try {
        const response = await apiCall(`/clinics/secretaries/${id}`, 'DELETE');

        if (response?.success) {
            showToast('✅ تم حذف السكرتير بنجاح', 'success');
            loadSecretaries();
        } else {
            showToast('❌ فشل في حذف السكرتير: ' + (response?.error || 'خطأ غير معروف'), 'error');
        }
    } catch (error) {
        console.error('❌ Error deleting secretary:', error);
        showToast('❌ حدث خطأ: ' + (error.message || 'فشل حذف السكرتير'), 'error');
    }
}

// ============================================
// ✅ بدء التشغيل
// ============================================
// ✅ التحقق من التوكن
if (!token || token === 'null' || token === 'undefined') {
    window.location.href = 'index.html';
}

// ✅ تحديث معلومات المستخدم
if (userData?.name) {
    document.getElementById('userName').textContent = userData.name;
    const roleMap = {
        'clinic_owner': 'صاحب عيادة',
        'university_student': 'طالب جامعي',
        'secretary': 'سكرتير',
        'doctor': 'طبيب'
    };
    document.getElementById('userRole').textContent = roleMap[userData.role] || 'مستخدم';
}

// ✅ تحميل السكرتيرات
loadSecretaries();

// ✅ إغلاق القائمة الجانبية عند تغيير الحجم
window.addEventListener('resize', () => {
    if (window.innerWidth > 768) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('show');
    }
});

// ✅ إغلاق القائمة عند الضغط على ESC
document.addEventListener('keydown', (e) => {

        document.getElementById('sidebar').classList.remove('open');
