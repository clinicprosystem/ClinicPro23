<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>ClinicPro - المعالجات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: #f0f4f8;
            min-height: 100vh;
        }

        :root {
            --primary: #1A5F7A;
            --primary-light: #57C0E8;
            --secondary: #57C0E8;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --radius: 16px;
            --sidebar-width: 270px;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 10px; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--primary);
            color: white;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            box-shadow: -4px 0 20px rgba(0,0,0,0.1);
        }

        .sidebar .logo {
            padding: 24px 20px 16px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .sidebar .logo span { color: var(--primary-light); }
        .sidebar .logo i { margin-left: 8px; }

        .sidebar .user-info {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        .sidebar .user-info .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 8px;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .sidebar .user-info .name {
            font-weight: 700;
            font-size: 16px;
        }

        .sidebar .user-info .role {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin-top: 2px;
        }

        .sidebar ul {
            list-style: none;
            padding: 8px 0;
        }

        .sidebar ul li {
            padding: 11px 24px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 14px;
            border-right: 3px solid transparent;
            font-size: 14px;
        }

        .sidebar ul li:hover {
            background: rgba(255,255,255,0.06);
            border-right-color: rgba(255,255,255,0.3);
        }

        .sidebar ul li.active {
            background: rgba(255,255,255,0.1);
            border-right-color: var(--primary-light);
        }

        .sidebar ul li i {
            width: 20px;
            text-align: center;
            font-size: 16px;
            color: rgba(255,255,255,0.7);
        }

        .sidebar ul li .badge {
            background: #ef4444;
            color: white;
            font-size: 10px;
            padding: 1px 8px;
            border-radius: 12px;
            margin-right: auto;
            font-weight: 700;
            min-width: 18px;
            text-align: center;
        }

        .sidebar ul li.logout {
            color: #fca5a5;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 16px;
        }

        .sidebar ul li.logout:hover {
            background: rgba(239, 68, 68, 0.12);
            border-right-color: #ef4444;
        }

        .sidebar ul li.logout i { color: #fca5a5; }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 999;
            backdrop-filter: blur(2px);
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-right: var(--sidebar-width);
            padding: 20px 24px;
            min-height: 100vh;
            max-width: calc(100% - var(--sidebar-width));
        }

        /* ===== HEADER ===== */
        .header {
            background: white;
            padding: 14px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .left h1 {
            font-size: 20px;
            color: var(--primary);
            font-weight: 800;
        }

        .header .left h1 i {
            margin-left: 8px;
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--primary);
            padding: 4px;
        }

        .header .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header .actions button {
            background: none;
            border: none;
            width: 38px;
            height: 38px;
            font-size: 17px;
            cursor: pointer;
            color: #64748b;
            border-radius: 50%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header .actions button:hover {
            background: #f1f5f9;
            color: var(--primary);
        }

        /* ===== FILTERS ===== */
        .filters-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            padding: 4px 0;
            overflow-x: auto;
        }

        .filter-chip {
            padding: 6px 18px;
            border-radius: 20px;
            border: 2px solid var(--primary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            color: var(--primary);
            white-space: nowrap;
            user-select: none;
        }

        .filter-chip:hover {
            background: #f0f7fa;
            transform: translateY(-1px);
        }

        .filter-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 2px 12px rgba(26, 95, 122, 0.3);
        }

        /* ===== TREATMENT CARD ===== */
        .treatment-card {
            background: white;
            border-radius: var(--radius);
            padding: 16px 18px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid transparent;
        }

        .treatment-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            border-color: var(--primary-light);
        }

        .treatment-card .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .treatment-card .service-tag {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
        }

        .treatment-card .service-tag.green { background: #d1fae5; color: #059669; }
        .treatment-card .service-tag.red { background: #fee2e2; color: #dc2626; }
        .treatment-card .service-tag.orange { background: #fef3c7; color: #d97706; }
        .treatment-card .service-tag.purple { background: #ede9fe; color: #7c3aed; }
        .treatment-card .service-tag.blue { background: #dbeafe; color: #2563eb; }
        .treatment-card .service-tag.default { background: rgba(26,95,122,0.1); color: var(--primary); }

        .treatment-card .date {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .treatment-card .date i {
            font-size: 11px;
        }

        .treatment-card .patient-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0 4px 0;
        }

        .treatment-card .patient-row i {
            color: var(--primary);
            font-size: 14px;
            width: 16px;
        }

        .treatment-card .patient-row .name {
            font-weight: 700;
            font-size: 15px;
            color: #0f172a;
        }

        .treatment-card .doctor-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #64748b;
        }

        .treatment-card .doctor-row i {
            font-size: 12px;
            color: #94a3b8;
            width: 16px;
        }

        .treatment-card .teeth-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }

        .treatment-card .teeth-row .tooth-chip {
            background: #f1f5f9;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 10px;
            color: #475569;
            font-weight: 500;
        }

        .treatment-card .arch-tag {
            background: rgba(26, 95, 122, 0.08);
            color: var(--primary);
            padding: 2px 12px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
            display: inline-block;
            margin-top: 6px;
        }

        .treatment-card .arch-tag i {
            font-size: 10px;
            margin-left: 4px;
        }

        .treatment-card .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #f1f5f9;
            flex-wrap: wrap;
            gap: 8px;
        }

        .treatment-card .bottom-row .price-section {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .treatment-card .bottom-row .price {
            font-size: 18px;
            font-weight: 800;
            color: var(--secondary);
        }

        .treatment-card .bottom-row .old-price {
            font-size: 13px;
            color: #94a3b8;
            text-decoration: line-through;
        }

        .treatment-card .bottom-row .discount-badge {
            font-size: 11px;
            color: #059669;
            background: #d1fae5;
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: 600;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 16px;
            color: #cbd5e1;
        }

        .empty-state h3 {
            font-size: 20px;
            color: #1e293b;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            color: #94a3b8;
        }

        .empty-state .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .empty-state .btn-group button {
            padding: 10px 24px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .empty-state .btn-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        .btn-primary {
            background: var(--secondary);
            color: white;
        }

        .btn-primary:hover {
            background: #4aadcc;
        }

        .btn-secondary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary:hover {
            background: #0f4c5c;
        }

        /* ===== LOADER ===== */
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }

        .loader .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== FAB ===== */
        .fab {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #57C0E8, #4aadcc);
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(87, 192, 232, 0.4);
            transition: all 0.3s ease;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab:hover {
            transform: scale(1.08) rotate(90deg);
            box-shadow: 0 6px 32px rgba(87, 192, 232, 0.5);
        }

        .fab:active {
            transform: scale(0.95);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(100%);
                width: 280px;
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.show { display: block; }
            .main-content {
                margin-right: 0;
                max-width: 100%;
                padding: 16px;
            }
            .hamburger { display: block; }
            .fab {
                bottom: 20px;
                left: 20px;
                width: 52px;
                height: 52px;
                font-size: 24px;
            }
            .header .left h1 {
                font-size: 18px;
            }
            .treatment-card {
                padding: 14px 16px;
            }
        }

        @media (max-width: 480px) {
            .main-content {
                padding: 12px;
            }
            .header {
                padding: 12px 16px;
            }
            .header .left h1 {
                font-size: 16px;
            }
            .treatment-card .bottom-row .price {
                font-size: 16px;
            }
            .filter-chip {
                font-size: 12px;
                padding: 4px 14px;
            }
            .fab {
                bottom: 16px;
                left: 16px;
                width: 48px;
                height: 48px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

<!-- ===== SIDEBAR OVERLAY ===== -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar" id="sidebar">
    <div class="logo">
        <i class="fas fa-tooth"></i> <span>Clinic</span>Pro
    </div>
    <div class="user-info">
        <div class="avatar"><i class="fas fa-user"></i></div>
        <div class="name" id="userName">طبيب الأسنان</div>
        <div class="role" id="userRole">صاحب عيادة</div>
    </div>
    <ul>
        <li onclick="navigateTo('dashboard.html')">
            <i class="fas fa-chart-pie"></i> الرئيسية
        </li>
        <li onclick="navigateTo('patients.html')">
            <i class="fas fa-users"></i> المرضى
        </li>
        <li class="active">
            <i class="fas fa-tooth"></i> المعالجات
            <span class="badge" id="treatmentsBadge">0</span>
        </li>
        <li onclick="navigateTo('services.html')">
            <i class="fas fa-list"></i> الخدمات
        </li>
        <li onclick="navigateTo('doctors.html')">
            <i class="fas fa-user-md"></i> الأطباء
        </li>
        <li onclick="navigateTo('secretaries.html')">
            <i class="fas fa-user-tie"></i> السكرتيرات
        </li>
        <li onclick="navigateTo('lab.html')">
            <i class="fas fa-flask"></i> المعمل
        </li>
        <li onclick="navigateTo('reports.html')">
            <i class="fas fa-chart-bar"></i> التقارير
        </li>
        <li onclick="navigateTo('notifications.html')">
            <i class="fas fa-bell"></i> الإشعارات
        </li>
        <li onclick="navigateTo('settings.html')">
            <i class="fas fa-cog"></i> الإعدادات
        </li>
        <li onclick="navigateTo('profile.html')">
            <i class="fas fa-user-circle"></i> الملف الشخصي
        </li>
        <li onclick="navigateTo('subscription-plans.html')">
            <i class="fas fa-crown"></i> باقات الاشتراك
        </li>
        <li class="logout" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> تسجيل خروج
        </li>
    </ul>
</div>

<!-- ===== MAIN CONTENT ===== -->
<div class="main-content">
    <!-- ===== HEADER ===== -->
    <div class="header">
        <div class="left">
            <button class="hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <h1><i class="fas fa-tooth"></i> المعالجات</h1>
        </div>
        <div class="actions">
            <button onclick="loadTreatments()" title="تحديث من السيرفر">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>

    <!-- ===== FILTERS ===== -->
    <div class="filters-container" id="filtersContainer">
        <span class="filter-chip active" data-filter="الكل" onclick="filterTreatments('الكل', this)">الكل</span>
    </div>

    <!-- ===== TREATMENTS LIST ===== -->
    <div id="treatmentsList">
        <div class="loader"><div class="spinner"></div></div>
    </div>
</div>

<!-- ===== FAB ===== -->
<button class="fab" onclick="addTreatment()">
    <i class="fas fa-plus"></i>
</button>

<script>
// ============================================
// ✅ الإعدادات الأساسية
// ============================================
const API_BASE = 'https://clinicprosystem.koyeb.app/api';
let token = localStorage.getItem('token') || '';
let userData = JSON.parse(localStorage.getItem('user') || '{}');
let treatments = [];
let selectedFilter = 'الكل';
let isLoading = false;

// ============================================
// ✅ ألوان الخدمات (مثل التطبيق)
// ============================================
const serviceColors = {
    'حشو': 'green',
    'خلع': 'red',
    'علاج عصب': 'orange',
    'تقويم': 'purple',
    'تبييض': 'blue'
};

// ============================================
// ✅ دوال API
// ============================================
async function apiCall(endpoint, method = 'GET', body = null) {
    const headers = {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
    };
    if (token) headers['Authorization'] = `Bearer ${token}`;

    const options = { method, headers };
    if (body) options.body = JSON.stringify(body);

    try {
        const response = await fetch(`${API_BASE}${endpoint}`, options);
        if (response.status === 401) {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
            return null;
        }
        return await response.json();
    } catch (e) {
        console.error('❌ API Error:', e);
        return null;
    }
}

// ============================================
// ✅ التنقل
// ============================================
function navigateTo(page) {
    if (window.innerWidth <= 768) toggleSidebar(false);
    window.location.href = page;
}

function toggleSidebar(forceState) {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    if (typeof forceState === 'boolean') {
        sidebar.classList.toggle('open', forceState);
        overlay.classList.toggle('show', forceState);
    } else {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
    }
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'index.html';
}

// ============================================
// ✅ تحميل المعالجات
// ============================================
async function loadTreatments() {
    if (isLoading) return;
    isLoading = true;

    const list = document.getElementById('treatmentsList');
    list.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

    try {
        // ✅ محاولة جلب من API
        const response = await apiCall('/treatments');
        
        if (response?.treatments) {
            treatments = response.treatments;
            document.getElementById('treatmentsBadge').textContent = treatments.length;
            updateFilters();
            renderTreatments();
            isLoading = false;
            return;
        }
        
        // ✅ إذا فشل، عرض رسالة
        list.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>
                <h3>فشل تحميل المعالجات</h3>
                <p>يرجى التحقق من اتصالك بالإنترنت</p>
                <div class="btn-group">
                    <button class="btn-primary" onclick="loadTreatments()">
                        <i class="fas fa-sync-alt"></i> إعادة المحاولة
                    </button>
                    <button class="btn-secondary" onclick="addTreatment()">
                        <i class="fas fa-plus"></i> إضافة معالجة
                    </button>
                </div>
            </div>
        `;
        isLoading = false;

    } catch (error) {
        console.error('❌ Error loading treatments:', error);
        list.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>
                <h3>حدث خطأ</h3>
                <p>فشل في تحميل بيانات المعالجات</p>
                <button class="btn-primary" onclick="loadTreatments()">
                    <i class="fas fa-sync-alt"></i> إعادة المحاولة
                </button>
            </div>
        `;
        isLoading = false;
    }
}

// ============================================
// ✅ تحديث الفلاتر (مثل التطبيق)
// ============================================
function updateFilters() {
    const container = document.getElementById('filtersContainer');
    const services = new Set();
    
    treatments.forEach(t => {
        const name = t.subServiceName || t.serviceName;
        if (name) services.add(name);
    });

    let html = '<span class="filter-chip active" data-filter="الكل" onclick="filterTreatments(\'الكل\', this)">الكل</span>';
    services.forEach(s => {
        html += `<span class="filter-chip" data-filter="${s}" onclick="filterTreatments('${s}', this)">${s}</span>`;
    });
    container.innerHTML = html;
}

// ============================================
// ✅ فلترة المعالجات
// ============================================
function filterTreatments(filter, element) {
    selectedFilter = filter;
    document.querySelectorAll('.filter-chip').forEach(el => el.classList.remove('active'));
    if (element) element.classList.add('active');
    renderTreatments();
}

// ============================================
// ✅ عرض المعالجات
// ============================================
function renderTreatments() {
    const list = document.getElementById('treatmentsList');

    // ✅ فلترة المعالجات
    const filtered = selectedFilter === 'الكل'
        ? treatments
        : treatments.filter(t =>
            (t.subServiceName || t.serviceName) === selectedFilter
        );

    document.getElementById('treatmentsBadge').textContent = treatments.length;

    if (filtered.length === 0) {
        list.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-tooth"></i>
                <h3>${treatments.length === 0 ? 'لا توجد معالجات' : 'لا توجد نتائج'}</h3>
                <p>${treatments.length === 0 ? 'اضغط على زر التحديث لجلب المعالجات من السيرفر' : 'جرب فلتر آخر'}</p>
                <div class="btn-group">
                    <button class="btn-primary" onclick="loadTreatments()">
                        <i class="fas fa-cloud-download-alt"></i> جلب من السيرفر
                    </button>
                    <button class="btn-secondary" onclick="addTreatment()">
                        <i class="fas fa-plus"></i> إضافة معالجة
                    </button>
                </div>
            </div>
        `;
        return;
    }

    // ✅ ترتيب حسب التاريخ (الأحدث أولاً) - مثل التطبيق
    const sorted = [...filtered].sort((a, b) => {
        const dateA = new Date(a.date || a.createdAt || 0);
        const dateB = new Date(b.date || b.createdAt || 0);
        return dateB - dateA;
    });

    list.innerHTML = sorted.map(t => {
        const id = t._id || t.id || '';
        const serviceName = t.subServiceName || t.serviceName || 'خدمة';
        const color = serviceColors[serviceName] || 'default';
        const patientName = t.patientName || t.patient?.name || 'مريض';
        const doctorName = t.doctorName || t.doctor?.name || 'غير محدد';
        const price = t.finalPrice || t.price || 0;
        const originalPrice = t.originalPrice || price;
        const discount = t.discount || 0;
        const date = t.date ? t.date.substring(0, 10) : 'تاريخ غير محدد';
        const teeth = t.teeth || t.teethDetails || [];
        const archType = t.archType || t.jawDetails?.jawType || '';

        const teethHtml = teeth.length > 0
            ? `<div class="teeth-row">${teeth.map(tooth => {
                const num = tooth.number || tooth || '';
                return `<span class="tooth-chip">السن ${num}</span>`;
            }).join('')}</div>`
            : '';

        const archHtml = archType
            ? `<span class="arch-tag"><i class="fas fa-archway"></i> ${archType}</span>`
            : '';

        return `
            <div class="treatment-card" onclick="viewTreatment('${id}')">
                <div class="top-row">
                    <span class="service-tag ${color}">${serviceName}</span>
                    <span class="date"><i class="fas fa-calendar-alt"></i> ${date}</span>
                </div>
                <div class="patient-row">
                    <i class="fas fa-user"></i>
                    <span class="name">${patientName}</span>
                </div>
                <div class="doctor-row">
                    <i class="fas fa-user-md"></i>
                    <span>الطبيب المعالج: ${doctorName}</span>
                </div>
                ${teethHtml}
                ${archHtml}
                <div class="bottom-row">
                    <div class="price-section">
                        ${discount > 0 ? `<span class="old-price">${originalPrice} ريال</span>` : ''}
                        <span class="price">${price} ريال</span>
                        ${discount > 0 ? `<span class="discount-badge">-${discount} ريال</span>` : ''}
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

// ============================================
// ✅ دوال الإجراءات
// ============================================
function viewTreatment(id) {
    if (id) {
        window.location.href = `treatment-details.html?id=${id}`;
    } else {
        alert('⚠️ لا يمكن عرض تفاصيل هذه المعالجة');
    }
}

function addTreatment() {
    // ✅ الانتقال إلى صفحة إضافة معالجة
    window.location.href = 'add-treatment.html';
}

// ============================================
// ✅ بدء التشغيل
// ============================================
// ✅ التحقق من التوكن
if (!token || token === 'null' || token === 'undefined') {
    window.location.href = 'index.html';
}

// ✅ تحديث معلومات المستخدم
if (userData?.name) {
    document.getElementById('userName').textContent = userData.name;
    const roleMap = {
        'clinic_owner': 'صاحب عيادة',
        'university_student': 'طالب جامعي',
        'secretary': 'سكرتير',
        'doctor': 'طبيب'
    };
    document.getElementById('userRole').textContent = roleMap[userData.role] || 'مستخدم';
}

// ✅ تحميل المعالجات
loadTreatments();

// ✅ إغلاق القائمة الجانبية عند تغيير الحجم
window.addEventListener('resize', () => {
    if (window.innerWidth > 768) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('show');
    }
});

// ✅ إغلاق القائمة عند الضغط على ESC
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('show');
    }
});

console.log('🚀 ClinicPro - Treatments Screen Loaded');
console.log('📱 Flutter to HTML - تم التحويل بنجاح!');
</script>
