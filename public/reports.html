<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicPro - التقارير</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: #f0f4f8; min-height: 100vh; }

        .sidebar {
            position: fixed; right: 0; top: 0; bottom: 0; width: 260px;
            background: #1A5F7A; color: white; padding: 0; z-index: 1000;
            transition: transform 0.3s ease; overflow-y: auto;
        }
        .sidebar .logo { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 22px; font-weight: 800; }
        .sidebar .logo span { color: #57C0E8; }
        .sidebar .user-info { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .sidebar .user-info .avatar { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.2); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 8px; }
        .sidebar .user-info .name { font-weight: 700; font-size: 16px; }
        .sidebar .user-info .role { font-size: 12px; color: rgba(255,255,255,0.6); }
        .sidebar ul { list-style: none; padding: 12px 0; }
        .sidebar ul li { padding: 12px 24px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 12px; border-right: 4px solid transparent; }
        .sidebar ul li:hover, .sidebar ul li.active { background: rgba(255,255,255,0.08); border-right-color: #57C0E8; }
        .sidebar ul li i { width: 20px; text-align: center; font-size: 16px; }
        .sidebar ul li.logout { color: #f87171; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 16px; }
        .sidebar ul li.logout:hover { background: rgba(239, 68, 68, 0.15); }

        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 999; }

        .main-content { margin-right: 260px; padding: 20px; min-height: 100vh; }

        .header {
            background: white; padding: 12px 20px; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
        }
        .header .left { display: flex; align-items: center; gap: 12px; }
        .header .left h1 { font-size: 20px; color: #1A5F7A; }
        .header .left .hamburger { display: none; background: none; border: none; font-size: 24px; cursor: pointer; color: #1A5F7A; }
        .header .actions button { background: none; border: none; font-size: 18px; cursor: pointer; color: #555; padding: 8px; border-radius: 50%; transition: background 0.3s; }
        .header .actions button:hover { background: #f0f4f8; }

        .tabs {
            display: flex; gap: 4px; margin-bottom: 16px; background: white; border-radius: 12px; padding: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .tabs .tab {
            flex: 1; padding: 10px; text-align: center; border-radius: 10px; cursor: pointer; transition: all 0.3s; font-weight: 700; color: #64748b;
        }
        .tabs .tab:hover { background: #f1f5f9; }
        .tabs .tab.active { background: #1A5F7A; color: white; }

        .date-selector {
            background: white; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .date-selector .label { font-weight: 700; color: #1e293b; }
        .date-selector .controls { display: flex; align-items: center; gap: 8px; }
        .date-selector .controls button {
            background: none; border: none; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 16px;
            transition: background 0.2s;
        }
        .date-selector .controls button:hover { background: #f1f5f9; }
        .date-selector .controls select {
            padding: 6px 10px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; background: white;
        }
        .date-selector .controls select:focus { border-color: #1A5F7A; outline: none; }

        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px;
        }
        .stat-card {
            background: white; border-radius: 12px; padding: 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .stat-card .icon { font-size: 28px; margin-bottom: 6px; }
        .stat-card .value { font-size: 22px; font-weight: 800; }
        .stat-card .label { font-size: 12px; color: #64748b; }

        .doctors-section, .treatments-section {
            background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .doctors-section .title, .treatments-section .title {
            font-size: 18px; font-weight: 700; color: #1A5F7A; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }
        .doctor-item {
            padding: 10px 0; border-bottom: 1px solid #f1f5f9;
        }
        .doctor-item:last-child { border-bottom: none; }
        .doctor-item .row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px; }
        .doctor-item .name { font-weight: 700; }
        .doctor-item .amount { font-weight: 700; color: #1A5F7A; }
        .doctor-item .share { font-size: 13px; color: #059669; }
        .doctor-item .bar {
            height: 4px; background: #e2e8f0; border-radius: 4px; margin-top: 4px; overflow: hidden;
        }
        .doctor-item .bar .fill { height: 100%; background: #1A5F7A; border-radius: 4px; transition: width 0.5s; }

        .treatment-item {
            padding: 10px 0; border-bottom: 1px solid #f1f5f9;
        }
        .treatment-item:last-child { border-bottom: none; }
        .treatment-item .row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px; }
        .treatment-item .service { font-weight: 700; }
        .treatment-item .patient { font-size: 13px; color: #64748b; }
        .treatment-item .price { font-weight: 700; color: #1A5F7A; }
        .treatment-item .status {
            font-size: 11px; padding: 2px 10px; border-radius: 12px;
        }
        .treatment-item .status.paid { background: #d1fae5; color: #059669; }
        .treatment-item .status.pending { background: #fef3c7; color: #d97706; }

        .loader { display: flex; justify-content: center; align-items: center; min-height: 200px; }
        .loader .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #1A5F7A; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state { text-align: center; padding: 40px 20px; color: #94a3b8; }
        .empty-state i { font-size: 48px; margin-bottom: 12px; color: #cbd5e1; }

        .restricted { text-align: center; padding: 60px 20px; }
        .restricted i { font-size: 80px; color: #cbd5e1; margin-bottom: 16px; }
        .restricted h3 { font-size: 20px; color: #64748b; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(100%); width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.show { display: block; }
            .main-content { margin-right: 0; }
            .header .left .hamburger { display: block; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .header .left h1 { font-size: 16px; }
        }
    </style>
</head>
<body>

<!-- القائمة الجانبية -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
    <div class="logo">🏥 <span>Clinic</span>Pro</div>
    <div class="user-info">
        <div class="avatar">👤</div>
        <div class="name" id="userName">طبيب الأسنان</div>
        <div class="role" id="userRole">صاحب عيادة</div>
    </div>
    <ul>
        <li onclick="window.location.href='dashboard.html'"><i class="fas fa-chart-pie"></i> الرئيسية</li>
        <li onclick="window.location.href='patients.html'"><i class="fas fa-users"></i> المرضى</li>
        <li onclick="window.location.href='treatments.html'"><i class="fas fa-tooth"></i> المعالجات</li>
        <li onclick="window.location.href='services.html'"><i class="fas fa-list"></i> الخدمات</li>
        <li onclick="window.location.href='doctors.html'"><i class="fas fa-user-md"></i> الأطباء</li>
        <li onclick="window.location.href='secretaries.html'"><i class="fas fa-user-tie"></i> السكرتيرات</li>
        <li onclick="window.location.href='lab.html'"><i class="fas fa-flask"></i> المعمل</li>
        <li class="active"><i class="fas fa-chart-bar"></i> التقارير</li>
        <li onclick="window.location.href='notifications.html'"><i class="fas fa-bell"></i> الإشعارات</li>
        <li onclick="window.location.href='settings.html'"><i class="fas fa-cog"></i> الإعدادات</li>
        <li onclick="window.location.href='profile.html'"><i class="fas fa-user-circle"></i> الملف الشخصي</li>
        <li class="logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</li>
    </ul>
</div>

<!-- المحتوى الرئيسي -->
<div class="main-content" id="mainContent">
    <div class="header">
        <div class="left">
            <button class="hamburger" onclick="toggleSidebar()">☰</button>
            <h1>📊 التقارير والإحصائيات</h1>
        </div>
        <div class="actions">
            <button onclick="loadReport()" title="تحديث"><i class="fas fa-sync-alt"></i></button>
        </div>
    </div>

    <!-- التبويبات -->
    <div class="tabs" id="tabsContainer">
        <div class="tab active" data-tab="daily" onclick="switchTab('daily', this)">يومي</div>
        <div class="tab" data-tab="monthly" onclick="switchTab('monthly', this)">شهري</div>
        <div class="tab" data-tab="yearly" onclick="switchTab('yearly', this)">سنوي</div>
    </div>

    <!-- محدد التاريخ -->
    <div class="date-selector" id="dateSelector">
        <span class="label" id="dateLabel">📅 اختر التاريخ</span>
        <div class="controls" id="dateControls">
            <!-- يتم إنشاؤه بواسطة JS -->
        </div>
    </div>

    <!-- محتوى التقرير -->
    <div id="reportContent">
        <div class="loader"><div class="spinner"></div></div>
    </div>
</div>

<script>
// ============================================
// ✅ الإعدادات الأساسية
// ============================================
const API_BASE = 'https://marginal-addi-1realitylotter1-37028393.koyeb.app/api';
let token = localStorage.getItem('token') || '';
let userData = JSON.parse(localStorage.getItem('user') || '{}');
let currentTab = 'daily';
let selectedDate = new Date();
let selectedMonth = new Date().getMonth() + 1;
let selectedYear = new Date().getFullYear();
let reportData = {};
let isLoading = false;
let isUniversityStudent = false;

const months = ['يناير', 'فبراير', 'مارس', 'إبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];

// ============================================
// ✅ دوال API
// ============================================
async function apiCall(endpoint, method = 'GET', body = null) {
    const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const options = { method, headers };
    if (body) options.body = JSON.stringify(body);
    try {
        const response = await fetch(`${API_BASE}${endpoint}`, options);
        if (response.status === 401) { localStorage.removeItem('token'); window.location.href = 'index.html'; return null; }
        return await response.json();
    } catch (e) { console.error('❌ API Error:', e); return null; }
}

// ============================================
// ✅ تبديل التبويبات
// ============================================
function switchTab(tab, element) {
    currentTab = tab;
    document.querySelectorAll('.tabs .tab').forEach(el => el.classList.remove('active'));
    if (element) element.classList.add('active');
    updateDateSelector();
    loadReport();
}

// ============================================
// ✅ تحديث محدد التاريخ
// ============================================
function updateDateSelector() {
    const controls = document.getElementById('dateControls');
    const label = document.getElementById('dateLabel');

    if (currentTab === 'daily') {
        label.textContent = '📅 اختر التاريخ';
        controls.innerHTML = `
            <button onclick="changeDate(-1)"><i class="fas fa-chevron-right"></i></button>
            <span>${formatDate(selectedDate)}</span>
            <button onclick="changeDate(1)"><i class="fas fa-chevron-left"></i></button>
        `;
    } else if (currentTab === 'monthly') {
        label.textContent = '📅 اختر الشهر والسنة';
        controls.innerHTML = `
            <select id="monthSelect" onchange="updateMonthYear()">
                ${months.map((m, i) => `<option value="${i+1}" ${i+1 === selectedMonth ? 'selected' : ''}>${m}</option>`).join('')}
            </select>
            <select id="yearSelect" onchange="updateMonthYear()">
                ${[2023,2024,2025,2026,2027].map(y => `<option value="${y}" ${y === selectedYear ? 'selected' : ''}>${y}</option>`).join('')}
            </select>
        `;
    } else {
        label.textContent = '📅 اختر السنة';
        controls.innerHTML = `
            <select id="yearSelectYearly" onchange="updateYearly()">
                ${[2023,2024,2025,2026,2027].map(y => `<option value="${y}" ${y === selectedYear ? 'selected' : ''}>${y}</option>`).join('')}
            </select>
        `;
    }
}

function formatDate(date) {
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}

function changeDate(delta) {
    selectedDate.setDate(selectedDate.getDate() + delta);
    updateDateSelector();
    loadReport();
}

function updateMonthYear() {
    selectedMonth = parseInt(document.getElementById('monthSelect').value);
    selectedYear = parseInt(document.getElementById('yearSelect').value);
    loadReport();
}

function updateYearly() {
    selectedYear = parseInt(document.getElementById('yearSelectYearly').value);
    loadReport();
}

// ============================================
// ✅ تحميل التقرير
// ============================================
async function loadReport() {
    if (isUniversityStudent) {
        document.getElementById('reportContent').innerHTML = `
            <div class="restricted">
                <i class="fas fa-ban"></i>
                <h3>التقارير غير متاحة في باقة طالب جامعي</h3>
            </div>
        `;
        return;
    }

    const content = document.getElementById('reportContent');
    content.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
    isLoading = true;

    try {
        let response;
        if (currentTab === 'daily') {
            const date = formatDate(selectedDate);
            response = await apiCall(`/reports/daily?date=${date}`);
        } else if (currentTab === 'monthly') {
            response = await apiCall(`/reports/monthly?year=${selectedYear}&month=${selectedMonth}`);
        } else {
            response = await apiCall(`/reports/profit?start=${selectedYear}-01-01&end=${selectedYear}-12-31`);
        }

        if (response?.success !== false) {
            reportData = extractReportData(response);
            renderReport();
        } else {
            content.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>فشل في تحميل التقرير</p></div>`;
        }
    } catch (e) {
        console.error('❌ Error:', e);
        content.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>حدث خطأ في تحميل التقرير</p></div>`;
    }
    isLoading = false;
}

// ============================================
// ✅ استخراج بيانات التقرير
// ============================================
function extractReportData(raw) {
    const data = raw?.data || raw?.report || raw?.result || raw || {};
    const total = data.total || data.revenue || data.income || data.profit || data.totalRevenue || 0;
    const count = data.treatmentsCount || data.count || data.totalTreatments || 0;
    const totalPaid = data.totalPaid || 0;
    const totalRemaining = data.totalRemaining || 0;

    let doctors = {};
    const doctorsData = data.doctors || data.doctorsReport || data.doctors_summary || data.doctorsStats;
    if (doctorsData) {
        if (Array.isArray(doctorsData)) {
            doctorsData.forEach(d => {
                const name = d.name || d.doctorName || d.doctor || 'غير معروف';
                doctors[name] = {
                    total: d.total || d.revenue || d.income || 0,
                    count: d.count || d.treatmentsCount || 0,
                    percentage: d.percentage || d.sharePercentage || 0
                };
            });
        } else if (typeof doctorsData === 'object') {
            Object.keys(doctorsData).forEach(name => {
                const d = doctorsData[name];
                doctors[name] = {
                    total: d.total || d.revenue || d.income || 0,
                    count: d.count || d.treatmentsCount || 0,
                    percentage: d.percentage || d.sharePercentage || 0
                };
            });
        }
    }

    // حساب حصة كل طبيب
    if (Object.keys(doctors).length > 0 && total > 0) {
        Object.keys(doctors).forEach(name => {
            const doctorTotal = doctors[name].total;
            const percentage = doctors[name].percentage || 0;
            doctors[name].share = Math.round((doctorTotal * percentage) / 100);
        });
    }

    const treatments = data.treatments || data.items || data.data || [];

    return { total, count, totalPaid, totalRemaining, doctors, treatments };
}

// ============================================
// ✅ عرض التقرير
// ============================================
function renderReport() {
    const content = document.getElementById('reportContent');
    const { total, count, totalPaid, totalRemaining, doctors, treatments } = reportData;
    const doctorList = Object.keys(doctors);

    let doctorsHtml = '';
    if (doctorList.length > 0) {
        const maxTotal = Math.max(...doctorList.map(d => doctors[d].total), 1);
        doctorsHtml = `
            <div class="doctors-section">
                <div class="title"><i class="fas fa-user-md"></i> إحصائيات الأطباء (${doctorList.length})</div>
                ${doctorList.map(name => {
                    const d = doctors[name];
                    const percent = maxTotal > 0 ? Math.round((d.total / maxTotal) * 100) : 0;
                    return `
                        <div class="doctor-item">
                            <div class="row">
                                <span class="name">${name}</span>
                                <span class="amount">${d.total} ريال</span>
                            </div>
                            <div class="row">
                                <span style="font-size:12px;color:#64748b;">${d.count || 0} معالجة</span>
                                <span class="share">حصة الطبيب: ${d.share || 0} ريال</span>
                            </div>
                            <div class="bar"><div class="fill" style="width:${percent}%;"></div></div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    }

    let treatmentsHtml = '';
    const treatmentsList = Array.isArray(treatments) ? treatments.slice(0, 10) : [];
    if (treatmentsList.length > 0) {
        treatmentsHtml = `
            <div class="treatments-section">
                <div class="title"><i class="fas fa-list"></i> قائمة المعالجات</div>
                ${treatmentsList.map(t => {
                    const service = t.serviceName || t.subServiceName || t.name || 'معالجة';
                    const patient = t.patientName || t.patient || 'مريض';
                    const price = t.price || t.finalPrice || 0;
                    const paid = t.paid || 0;
                    const remaining = t.remaining || (price - paid);
                    const status = remaining > 0 ? 'pending' : 'paid';
                    const statusText = remaining > 0 ? `متبقي ${remaining}` : 'مدفوع بالكامل';
                    return `
                        <div class="treatment-item">
                            <div class="row">
                                <span class="service">${service}</span>
                                <span class="price">${price} ريال</span>
                            </div>
                            <div class="row">
                                <span class="patient">👤 ${patient}</span>
                                <span class="status ${status}">${statusText}</span>
                            </div>
                        </div>
                    `;
                }).join('')}
                ${treatments.length > 10 ? `<div style="text-align:center;font-size:12px;color:#94a3b8;padding-top:8px;">و ${treatments.length - 10} معالجات أخرى...</div>` : ''}
            </div>
        `;
    }

    content.innerHTML = `
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon" style="color:#059669;">💰</div>
                <div class="value" style="color:#059669;">${total} ريال</div>
                <div class="label">إجمالي الدخل</div>
            </div>
            <div class="stat-card">
                <div class="icon" style="color:#1A5F7A;">🦷</div>
                <div class="value" style="color:#1A5F7A;">${count}</div>
                <div class="label">عدد المعالجات</div>
            </div>
            <div class="stat-card">
                <div class="icon" style="color:#2563eb;">💳</div>
                <div class="value" style="color:#2563eb;">${totalPaid} ريال</div>
                <div class="label">إجمالي المدفوع</div>
            </div>
            <div class="stat-card">
                <div class="icon" style="color:#d97706;">📊</div>
                <div class="value" style="color:#d97706;">${totalRemaining} ريال</div>
                <div class="label">المتبقي</div>
            </div>
        </div>
        ${doctorsHtml}
        ${treatmentsHtml}
        ${doctorList.length === 0 && treatmentsList.length === 0 ? `<div class="empty-state"><i class="fas fa-inbox"></i><p>لا توجد بيانات لعرضها</p></div>` : ''}
    `;
}

// ============================================
// ✅ دوال مساعدة
// ============================================
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('show');
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'index.html';
}

// ============================================
// ✅ بدء التشغيل
// ============================================
if (!token || token === 'null' || token === 'undefined') {
    window.location.href = 'index.html';
}

if (userData?.name) {
    document.getElementById('userName').textContent = userData.name;
    document.getElementById('userRole').textContent =
        userData.role === 'clinic_owner' ? 'صاحب عيادة' :
        userData.role === 'university_student' ? 'طالب جامعي' :
        userData.role === 'secretary' ? 'سكرتير' :
        userData.role === 'doctor' ? 'طبيب' : 'مستخدم';
}

if (userData?.role === 'university_student') {
    isUniversityStudent = true;
}

updateDateSelector();
loadReport();

window.addEventListener('resize', () => {
    if (window.innerWidth > 768) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('show');
    }
});
</script>
