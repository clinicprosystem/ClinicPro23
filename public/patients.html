<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicPro - المرضى</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: #f0f4f8;
            min-height: 100vh;
        }

        /* ===== القائمة الجانبية (نفسها) ===== */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: 260px;
            background: #1A5F7A;
            color: white;
            padding: 0;
            z-index: 1000;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }

        .sidebar .logo { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 22px; font-weight: 800; }
        .sidebar .logo span { color: #57C0E8; }
        .sidebar .user-info { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .sidebar .user-info .avatar { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.2); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 8px; }
        .sidebar .user-info .name { font-weight: 700; font-size: 16px; }
        .sidebar .user-info .role { font-size: 12px; color: rgba(255,255,255,0.6); }

        .sidebar ul { list-style: none; padding: 12px 0; }
        .sidebar ul li { padding: 12px 24px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 12px; border-right: 4px solid transparent; }
        .sidebar ul li:hover, .sidebar ul li.active { background: rgba(255,255,255,0.08); border-right-color: #57C0E8; }
        .sidebar ul li i { width: 20px; text-align: center; font-size: 16px; }
        .sidebar ul li .badge { background: #ef4444; color: white; font-size: 10px; padding: 1px 8px; border-radius: 12px; margin-right: auto; }
        .sidebar ul li.logout { color: #f87171; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 16px; }
        .sidebar ul li.logout:hover { background: rgba(239, 68, 68, 0.15); }

        .sidebar .divider { padding: 8px 24px; font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 1px; margin-top: 8px; }

        /* ===== المحتوى الرئيسي ===== */
        .main-content {
            margin-right: 260px;
            padding: 20px;
            min-height: 100vh;
        }

        /* ===== الهيدر ===== */
        .header {
            background: white;
            padding: 12px 20px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header .left { display: flex; align-items: center; gap: 12px; }
        .header .left h1 { font-size: 20px; color: #1A5F7A; }
        .header .left .hamburger { display: none; background: none; border: none; font-size: 24px; cursor: pointer; color: #1A5F7A; }
        .header .actions { display: flex; align-items: center; gap: 8px; }
        .header .actions button { background: none; border: none; font-size: 18px; cursor: pointer; color: #555; padding: 8px; border-radius: 50%; transition: background 0.3s; }
        .header .actions button:hover { background: #f0f4f8; }
        .header .offline-badge { background: #f59e0b; color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; }

        /* ===== شريط البحث ===== */
        .search-bar {
            background: white;
            border-radius: 12px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .search-bar i { color: #94a3b8; margin-left: 12px; }
        .search-bar input {
            flex: 1;
            border: none;
            padding: 10px 0;
            font-size: 14px;
            outline: none;
            background: transparent;
            text-align: right;
            font-family: 'Tajawal', sans-serif;
        }

        /* ===== قائمة المرضى ===== */
        .patient-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .patient-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        .patient-card .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(26, 95, 122, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #1A5F7A;
            flex-shrink: 0;
            position: relative;
        }

        .patient-card .avatar .sync-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: #f59e0b;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: white;
        }

        .patient-card .info { flex: 1; }
        .patient-card .info .name { font-weight: 700; font-size: 16px; color: #1e293b; }
        .patient-card .info .phone { font-size: 13px; color: #64748b; }
        .patient-card .info .details { font-size: 12px; color: #94a3b8; }
        .patient-card .info .sync-status { font-size: 10px; color: #f59e0b; margin-top: 4px; display: inline-block; background: #fef3c7; padding: 2px 8px; border-radius: 10px; }

        .patient-card .actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .patient-card .actions button {
            background: none;
            border: none;
            padding: 6px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 16px;
        }

        .patient-card .actions button:hover { background: #f1f5f9; }
        .patient-card .actions button.call { color: #1A5F7A; }
        .patient-card .actions button.whatsapp { color: #25D366; }
        .patient-card .actions button.delete { color: #ef4444; }

        .patient-card .arrow { color: #94a3b8; font-size: 18px; }

        /* ===== الحالات الفارغة ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state i { font-size: 64px; margin-bottom: 16px; color: #cbd5e1; }
        .empty-state h3 { font-size: 18px; color: #64748b; margin-bottom: 8px; }
        .empty-state p { font-size: 14px; }

        /* ===== لودر ===== */
        .loader { display: flex; justify-content: center; align-items: center; min-height: 200px; }
        .loader .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #1A5F7A; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== زر الإضافة ===== */
        .fab {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #57C0E8;
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(87, 192, 232, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 100;
        }

        .fab:hover { transform: scale(1.05); box-shadow: 0 6px 24px rgba(87, 192, 232, 0.5); }

        /* ===== متجاوب ===== */
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 999; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(100%); width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.show { display: block; }
            .main-content { margin-right: 0; }
            .header .left .hamburger { display: block; }
            .patient-card { flex-wrap: wrap; padding: 14px; }
            .patient-card .info { flex: 1 1 100%; }
            .patient-card .actions { flex: 1 1 100%; justify-content: flex-start; }
            .fab { bottom: 20px; left: 20px; width: 48px; height: 48px; font-size: 22px; }
        }

        @media (max-width: 480px) {
            .header .left h1 { font-size: 16px; }
            .patient-card .info .name { font-size: 14px; }
        }
    </style>
</head>
<body>

<!-- القائمة الجانبية -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
    <div class="logo">🏥 <span>Clinic</span>Pro</div>
    <div class="user-info">
        <div class="avatar">👤</div>
        <div class="name" id="userName">طبيب الأسنان</div>
        <div class="role" id="userRole">صاحب عيادة</div>
    </div>
    <ul>
        <li onclick="window.location.href='dashboard.html'"><i class="fas fa-chart-pie"></i> الرئيسية</li>
        <li class="active"><i class="fas fa-users"></i> المرضى <span class="badge" id="patientsBadge">0</span></li>
        <li onclick="window.location.href='treatments.html'"><i class="fas fa-tooth"></i> المعالجات</li>
        <li onclick="window.location.href='services.html'"><i class="fas fa-list"></i> الخدمات</li>
        <li onclick="window.location.href='doctors.html'"><i class="fas fa-user-md"></i> الأطباء</li>
        <li onclick="window.location.href='secretaries.html'"><i class="fas fa-user-tie"></i> السكرتيرات</li>
        <li onclick="window.location.href='lab.html'"><i class="fas fa-flask"></i> المعمل</li>
        <li onclick="window.location.href='reports.html'"><i class="fas fa-chart-bar"></i> التقارير</li>
        <li onclick="window.location.href='notifications.html'"><i class="fas fa-bell"></i> الإشعارات</li>
        <li onclick="window.location.href='settings.html'"><i class="fas fa-cog"></i> الإعدادات</li>
        <li onclick="window.location.href='profile.html'"><i class="fas fa-user-circle"></i> الملف الشخصي</li>
        <li class="logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</li>
    </ul>
</div>

<!-- المحتوى الرئيسي -->
<div class="main-content">
    <!-- الهيدر -->
    <div class="header">
        <div class="left">
            <button class="hamburger" onclick="toggleSidebar()">☰</button>
            <h1>👤 المرضى</h1>
        </div>
        <div class="actions">
            <button onclick="loadPatients()" title="تحديث"><i class="fas fa-sync-alt"></i></button>
            <span class="offline-badge" id="offlineBadge" style="display:none;">📴 غير متصل</span>
        </div>
    </div>

    <!-- شريط البحث -->
    <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="بحث بالاسم أو رقم الجوال..." oninput="filterPatients()">
    </div>

    <!-- قائمة المرضى -->
    <div id="patientsList">
        <div class="loader"><div class="spinner"></div></div>
    </div>
</div>

<!-- زر الإضافة -->
<button class="fab" onclick="addPatient()">+</button>

<script>
// ============================================
// ✅ الإعدادات الأساسية
// ============================================
const API_BASE = 'https://marginal-addi-1realitylotter1-37028393.koyeb.app/api';
let token = localStorage.getItem('token') || '';
let userData = JSON.parse(localStorage.getItem('user') || '{}');
let patients = [];
let filteredPatients = [];
let isOnline = true;

// ============================================
// ✅ دوال API
// ============================================
async function apiCall(endpoint, method = 'GET', body = null) {
    const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const options = { method, headers };
    if (body) options.body = JSON.stringify(body);
    try {
        const response = await fetch(`${API_BASE}${endpoint}`, options);
        if (response.status === 401) { localStorage.removeItem('token'); window.location.href = 'index.html'; return null; }
        return await response.json();
    } catch (e) { console.error('❌ API Error:', e); return null; }
}

// ============================================
// ✅ تحميل المرضى
// ============================================
// ============================================
// ✅ تحميل المرضى (بدون بيانات افتراضية)
// ============================================
async function loadPatients() {
    const list = document.getElementById('patientsList');
    list.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

    try {
        const response = await apiCall('/patients');
        if (response?.patients) {
            patients = response.patients;
            document.getElementById('patientsBadge').textContent = patients.length;
            isOnline = true;
            document.getElementById('offlineBadge').style.display = 'none';
            renderPatients();
            return;
        }
    } catch(e) {
        console.warn('⚠️ Failed to fetch from server:', e);
    }

    // ❌ إزالة البيانات الافتراضية - عرض خطأ فقط
    isOnline = false;
    document.getElementById('offlineBadge').style.display = 'inline-block';
    
    list.innerHTML = `
        <div class="empty-state">
            <i class="fas fa-exclamation-circle"></i>
            <h3>فشل في تحميل البيانات</h3>
            <p>يرجى التحقق من اتصالك بالإنترنت</p>
            <button onclick="loadPatients()" style="margin-top:12px;padding:8px 24px;background:#1A5F7A;color:white;border:none;border-radius:8px;cursor:pointer;">
                <i class="fas fa-sync-alt"></i> إعادة المحاولة
            </button>
        </div>
    `;
}

// ============================================
// ✅ عرض المرضى
// ============================================
function renderPatients() {
    const list = document.getElementById('patientsList');
    const query = document.getElementById('searchInput').value.trim().toLowerCase();

    filteredPatients = patients.filter(p =>
        p.name?.toLowerCase().includes(query) ||
        p.phone?.includes(query)
    );

    if (filteredPatients.length === 0) {
        list.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-users"></i>
                <h3>لا يوجد مرضى</h3>
                <p>اضغط على زر + لإضافة مريض جديد</p>
            </div>
        `;
        return;
    }

    list.innerHTML = filteredPatients.map(p => `
        <div class="patient-card" onclick="viewPatient('${p._id}')">
            <div class="avatar">
                ${p.gender === 'ذكر' ? '👨' : '👩'}
                <span class="sync-badge">🔄</span>
            </div>
            <div class="info">
                <div class="name">${p.name || 'غير محدد'}</div>
                <div class="phone">📞 ${p.phone || '-'}</div>
                <div class="details">🎂 ${p.age || '?'} سنة • ${p.gender || 'غير محدد'}</div>
                ${!isOnline ? '<div class="sync-status">📴 غير متصل</div>' : ''}
            </div>
            <div class="actions">
                <button class="call" onclick="event.stopPropagation();callPatient('${p.phone}')"><i class="fas fa-phone"></i></button>
                <button class="whatsapp" onclick="event.stopPropagation();whatsappPatient('${p.phone}')"><i class="fab fa-whatsapp"></i></button>
                <button class="delete" onclick="event.stopPropagation();deletePatient('${p._id}','${p.name}')"><i class="fas fa-trash"></i></button>
            </div>
            <div class="arrow"><i class="fas fa-chevron-left"></i></div>
        </div>
    `).join('');
}

// ============================================
// ✅ تصفية المرضى
// ============================================
function filterPatients() { renderPatients(); }

// ============================================
// ✅ دوال الإجراءات
// ============================================
function viewPatient(id) {
    alert(`📋 عرض تفاصيل المريض (ID: ${id})\n🚧 قيد التطوير`);
}

function callPatient(phone) {
    if (!phone) { alert('📞 رقم المريض غير متوفر'); return; }
    window.open(`tel:${phone}`, '_blank');
}

function whatsappPatient(phone) {
    if (!phone) { alert('📱 رقم المريض غير متوفر'); return; }
    const num = phone.replace('+', '');
    window.open(`https://wa.me/${num}`, '_blank');
}

function addPatient() {
    alert('➕ إضافة مريض جديد\n🚧 قيد التطوير');
}

function deletePatient(id, name) {
    if (!confirm(`🗑️ هل أنت متأكد من حذف المريض "${name}"؟`)) return;
    patients = patients.filter(p => p._id !== id);
    document.getElementById('patientsBadge').textContent = patients.length;
    renderPatients();
    alert('✅ تم حذف المريض');
}

// ============================================
// ✅ دوال مساعدة
// ============================================
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('show');
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'index.html';
}

// ============================================
// ✅ بدء التشغيل
// ============================================
if (!token || token === 'null' || token === 'undefined') {
    window.location.href = 'index.html';
}

if (userData?.name) {
    document.getElementById('userName').textContent = userData.name;
    document.getElementById('userRole').textContent =
        userData.role === 'clinic_owner' ? 'صاحب عيادة' :
        userData.role === 'university_student' ? 'طالب جامعي' :
        userData.role === 'secretary' ? 'سكرتير' :
        userData.role === 'doctor' ? 'طبيب' : 'مستخدم';
}

loadPatients();

// إغلاق القائمة الجانبية عند تغيير الحجم
window.addEventListener('resize', () => {
    if (window.innerWidth > 768) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('show');
    }
});
</script>

</body>
</html>
