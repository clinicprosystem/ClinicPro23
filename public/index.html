<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>ClinicPro - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f4c5c 0%, #1A5F7A 50%, #57C0E8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }

        .logo-icon svg {
            width: 45px;
            height: 45px;
            fill: #1A5F7A;
        }

        .logo h1 {
            color: white;
            font-size: 28px;
            font-weight: 800;
            margin-top: 16px;
        }

        .logo p {
            color: rgba(255,255,255,0.8);
            font-size: 16px;
        }

        .login-card {
            background: white;
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }

        .login-card h2 {
            color: #1A5F7A;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #333;
            margin-bottom: 6px;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .country-code {
            min-width: 70px;
            padding: 12px 8px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            text-align: center;
            transition: border-color 0.3s;
        }

        .country-code:focus {
            border-color: #1A5F7A;
            outline: none;
        }

        .country-code option {
            text-align: right;
        }

        .input-row input {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: border-color 0.3s;
            text-align: right;
            background: white;
            width: 100%;
        }

        .input-row input:focus {
            border-color: #1A5F7A;
            outline: none;
        }

        .input-full {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: border-color 0.3s;
            text-align: right;
            background: white;
        }

        .input-full:focus {
            border-color: #1A5F7A;
            outline: none;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            width: 100%;
            padding: 12px 14px;
            padding-left: 50px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: border-color 0.3s;
            text-align: right;
            background: white;
        }

        .password-wrapper input:focus {
            border-color: #1A5F7A;
            outline: none;
        }

        .toggle-password {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #999;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #57C0E8;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin-top: 8px;
        }

        .btn-login:hover {
            background: #4aadcc;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login:disabled {
            background: #b0d4e0;
            cursor: not-allowed;
        }

        .btn-login .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .signup-link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #666;
        }

        .signup-link a {
            color: #57C0E8;
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #dcfce7;
            color: #16a34a;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }

        .success-message.show {
            display: block;
        }

        .offline-badge {
            display: none;
            background: #f59e0b;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px 16px;
            }
            .logo h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <!-- الشعار -->
    <div class="logo">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm1-13h-2v6l5.25 3.15L17 12.23l-4-2.37V7z"/>
            </svg>
        </div>
        <h1>مرحباً بعودتك</h1>
        <p>نظام إدارة العيادة</p>
    </div>

    <!-- بطاقة تسجيل الدخول -->
    <div class="login-card">
        <h2>تسجيل الدخول إلى حسابك</h2>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <!-- رقم الجوال -->
        <div class="form-group">
            <label>رقم الجوال</label>
            <div class="input-row">
                <select class="country-code" id="countryCode">
                    <option value="+967">🇾🇪 +967</option>
                    <option value="+966">🇸🇦 +966</option>
                    <option value="+20">🇪🇬 +20</option>
                    <option value="+971">🇦🇪 +971</option>
                    <option value="+965">🇰🇼 +965</option>
                    <option value="+974">🇶🇦 +974</option>
                    <option value="+973">🇧🇭 +973</option>
                    <option value="+968">🇴🇲 +968</option>
                    <option value="+962">🇯🇴 +962</option>
                    <option value="+961">🇱🇧 +961</option>
                </select>
                <input type="tel" id="phoneInput" placeholder="7xxxxxxxx" dir="ltr">
            </div>
        </div>

        <!-- كلمة السر -->
        <div class="form-group">
            <label>كلمة السر</label>
            <div class="password-wrapper">
                <input type="password" id="passwordInput" placeholder="****" dir="ltr">
                <button class="toggle-password" id="togglePassword" type="button">👁️</button>
            </div>
        </div>

        <!-- زر تسجيل الدخول -->
        <button class="btn-login" id="loginBtn" onclick="login()">
            تسجيل الدخول
        </button>

        <div class="signup-link">
    ليس لديك حساب؟ <a href="signup.html" style="color:#57C0E8;font-weight:700;cursor:pointer;">سجل الآن</a>
        </div>
    </div>
</div>

<script>
// ✅ متغيرات
const API_BASE = 'https://clinicprosystem.koyeb.app/api';
let token = localStorage.getItem('token') || '';
let userData = null;

// ✅ عناصر DOM
const phoneInput = document.getElementById('phoneInput');
const passwordInput = document.getElementById('passwordInput');
const countryCode = document.getElementById('countryCode');
const loginBtn = document.getElementById('loginBtn');
const errorMsg = document.getElementById('errorMessage');
const successMsg = document.getElementById('successMessage');

// ✅ إظهار/إخفاء كلمة السر
document.getElementById('togglePassword').addEventListener('click', function() {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    this.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
});

// ✅ دالة عرض الخطأ
function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
    setTimeout(() => errorMsg.classList.remove('show'), 5000);
}

// ✅ دالة عرض النجاح
function showSuccess(msg) {
    successMsg.textContent = msg;
    successMsg.classList.add('show');
    setTimeout(() => successMsg.classList.remove('show'), 3000);
}

// ✅ الحصول على رقم الهاتف الكامل
function getFullPhone() {
    const code = countryCode.value;
    const phone = phoneInput.value.trim();
    return code + phone;
}

// ✅ التحقق من صحة الإدخال
function validateForm() {
    const phone = phoneInput.value.trim();
    const password = passwordInput.value.trim();

    if (!phone || phone.length < 9) {
        showError('الرجاء إدخال رقم جوال صحيح');
        return false;
    }
    if (!password || password.length < 3) {
        showError('الرجاء إدخال كلمة السر');
        return false;
    }
    return true;
}

// ✅ دالة تسجيل الدخول
async function login() {
    if (!validateForm()) return;

    const fullPhone = getFullPhone();
    const password = passwordInput.value.trim();

    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="spinner"></span> جاري تسجيل الدخول...';

    try {
        const response = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: fullPhone, password: password })
        });

        const data = await response.json();
        console.log('📡 رد السيرفر:', data);

        if (data.success) {
            token = data.token;
            userData = data.user;
            localStorage.setItem('token', token);
            localStorage.setItem('user', JSON.stringify(userData));
            showSuccess('✅ تم تسجيل الدخول بنجاح! جاري تحميل البيانات...');
            
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);
        } else {
            showError(data.error || '❌ رقم الجوال أو كلمة السر غير صحيحة');
            loginBtn.disabled = false;
            loginBtn.innerHTML = 'تسجيل الدخول';
        }
    } catch (error) {
        console.error('❌ خطأ:', error);
        showError('❌ خطأ في الاتصال بالسيرفر. تأكد من اتصالك بالإنترنت.');
        loginBtn.disabled = false;
        loginBtn.innerHTML = 'تسجيل الدخول';
    }
}

// ✅ تسجيل الدخول عند الضغط على Enter
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        login();
    }
});

// ✅ التحقق من الجلسة السابقة
if (localStorage.getItem('token')) {
    window.location.href = 'dashboard.html';
}

// ✅ صفحة التسجيل (مؤقت)
function showSignup() {
    alert('🚧 صفحة التسجيل قيد التطوير. يمكنك استخدام التطبيق للتسجيل حالياً.');
}
</script>

</body>
</html>
