<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>ClinicPro - المعمل</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: #f0f4f8;
            min-height: 100vh;
        }

        :root {
            --primary: #1A5F7A;
            --primary-light: #57C0E8;
            --secondary: #57C0E8;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --radius: 16px;
            --sidebar-width: 270px;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 10px; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--primary);
            color: white;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            box-shadow: -4px 0 20px rgba(0,0,0,0.1);
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(100%);
                width: 280px;
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.show { display: block !important; }
            .main-content {
                margin-right: 0 !important;
                max-width: 100% !important;
            }
            .hamburger { display: block !important; }
        }

        .sidebar .logo {
            padding: 24px 20px 16px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .sidebar .logo span { color: var(--primary-light); }
        .sidebar .logo i { margin-left: 8px; }

        .sidebar .user-info {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        .sidebar .user-info .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 8px;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .sidebar .user-info .name {
            font-weight: 700;
            font-size: 16px;
        }

        .sidebar .user-info .role {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin-top: 2px;
        }

        .sidebar ul {
            list-style: none;
            padding: 8px 0;
        }

        .sidebar ul li {
            padding: 11px 24px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 14px;
            border-right: 3px solid transparent;
            font-size: 14px;
        }

        .sidebar ul li:hover {
            background: rgba(255,255,255,0.06);
            border-right-color: rgba(255,255,255,0.3);
        }

        .sidebar ul li.active {
            background: rgba(255,255,255,0.1);
            border-right-color: var(--primary-light);
        }

        .sidebar ul li i {
            width: 20px;
            text-align: center;
            font-size: 16px;
            color: rgba(255,255,255,0.7);
        }

        .sidebar ul li.logout {
            color: #fca5a5;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 16px;
        }

        .sidebar ul li.logout:hover {
            background: rgba(239, 68, 68, 0.12);
            border-right-color: #ef4444;
        }

        .sidebar ul li.logout i { color: #fca5a5; }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            backdrop-filter: blur(2px);
        }

        .sidebar-overlay.show {
            display: block !important;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-right: var(--sidebar-width);
            padding: 20px 24px;
            min-height: 100vh;
            max-width: calc(100% - var(--sidebar-width));
        }

        /* ===== HEADER ===== */
        .header {
            background: white;
            padding: 14px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .left h1 {
            font-size: 20px;
            color: var(--primary);
            font-weight: 800;
        }

        .header .left h1 i {
            margin-left: 8px;
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--primary);
            padding: 4px;
        }

        .header .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header .actions button {
            background: none;
            border: none;
            width: 38px;
            height: 38px;
            font-size: 17px;
            cursor: pointer;
            color: #64748b;
            border-radius: 50%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header .actions button:hover {
            background: #f1f5f9;
            color: var(--primary);
        }

        /* ===== LAB CARD ===== */
        .lab-card {
            background: white;
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.25s ease;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .lab-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            border-color: var(--primary-light);
        }

        .lab-card .icon-box {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: rgba(26, 95, 122, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--primary);
            flex-shrink: 0;
        }

        .lab-card .info {
            flex: 1;
            min-width: 0;
        }

        .lab-card .info .name {
            font-weight: 800;
            font-size: 16px;
            color: #0f172a;
        }

        .lab-card .info .phone {
            font-size: 13px;
            color: #64748b;
            margin-top: 2px;
        }

        .lab-card .info .phone i {
            margin-left: 4px;
            color: #94a3b8;
        }

        .lab-card .info .address {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 1px;
        }

        .lab-card .info .address i {
            margin-left: 4px;
            color: #94a3b8;
        }

        .lab-card .actions {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .lab-card .actions button {
            background: none;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
            color: #64748b;
        }

        .lab-card .actions button:hover {
            background: #f1f5f9;
            transform: scale(1.05);
        }

        .lab-card .actions button.delete:hover {
            background: #fee2e2;
            color: #ef4444;
        }

        .lab-card .arrow {
            color: #cbd5e1;
            font-size: 18px;
            transition: transform 0.2s;
        }

        .lab-card:hover .arrow {
            transform: translateX(-4px);
            color: var(--primary-light);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 16px;
            color: #cbd5e1;
        }

        .empty-state h3 {
            font-size: 20px;
            color: #1e293b;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            color: #94a3b8;
        }

        .empty-state .retry-btn {
            margin-top: 16px;
            padding: 10px 32px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .empty-state .retry-btn:hover {
            background: #0f4c5c;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(26, 95, 122, 0.3);
        }

        /* ===== RESTRICTED ===== */
        .restricted {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .restricted i {
            font-size: 80px;
            color: #cbd5e1;
            margin-bottom: 16px;
        }

        .restricted h3 {
            font-size: 22px;
            color: #64748b;
            font-weight: 700;
        }

        .restricted p {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 8px;
        }

        /* ===== LOADER ===== */
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }

        .loader .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== FAB ===== */
        .fab {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #57C0E8, #4aadcc);
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(87, 192, 232, 0.4);
            transition: all 0.3s ease;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab:hover {
            transform: scale(1.08) rotate(90deg);
            box-shadow: 0 6px 32px rgba(87, 192, 232, 0.5);
        }

        .fab:active {
            transform: scale(0.95);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(100%);
                width: 280px;
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.show { display: block; }
            .main-content {
                margin-right: 0;
                max-width: 100%;
                padding: 16px;
            }
            .hamburger { display: block; }
            .lab-card {
                flex-wrap: wrap;
                padding: 14px 16px;
            }
            .lab-card .info {
                flex: 1 1 100%;
                order: 2;
            }
            .lab-card .icon-box {
                order: 1;
            }
            .lab-card .actions {
                order: 3;
                flex: 1 1 100%;
                justify-content: flex-start;
            }
            .lab-card .arrow {
                order: 4;
            }
            .fab {
                bottom: 20px;
                left: 20px;
                width: 52px;
                height: 52px;
                font-size: 24px;
            }
            .header .left h1 {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .main-content {
                padding: 12px;
            }
            .header {
                padding: 12px 16px;
            }
            .header .left h1 {
                font-size: 16px;
            }
            .lab-card .info .name {
                font-size: 14px;
            }
            .fab {
                bottom: 16px;
                left: 16px;
                width: 48px;
                height: 48px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

<!-- ===== SIDEBAR OVERLAY ===== -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar" id="sidebar">
    <div class="logo">
        <i class="fas fa-flask"></i> <span>Clinic</span>Pro
    </div>
    <div class="user-info">
        <div class="avatar"><i class="fas fa-user"></i></div>

        <div class="role" id="userRole">صاحب عيادة</div>
    </div>
    <ul>

        </li>
        <li onclick="window.location.href='services.html'">

        </li>

        </li>

        </li>

        </li>

<!-- ===== MAIN CONTENT ===== -->
<div class="main-content" id="mainContent">
    <!-- ===== HEADER ===== -->
    <div class="header">

    <i class="fas fa-plus"></i>
</button>

<script>
// ============================================
// ✅ الإعدادات الأساسية
// ============================================
const API_BASE = 'https://clinicprosystem.koyeb.app/api';
let token = localStorage.getItem('token') || '';  // ✅ أضف هذا
let userData = JSON.parse(localStorage.getItem('user') || '{}');
let labs = [];
let isUniversityStudent = false;
let isLoading = false;

// ============================================
// ✅ دوال API
// ============================================
async function apiCall(endpoint, method = 'GET', body = null) {
    // ✅ ✅ ✅ اقرأ التوكن في كل طلب (وليس مرة واحدة)
    const token = localStorage.getItem('token');
    
    console.log('🔑 التوكن في الطلب:', token ? '✅ موجود' : '❌ غير موجود');
    if (token) {
        console.log('🔑 أول 20 حرف:', token.substring(0, 20) + '...');
    }
    
    const headers = {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
    };
    if (token) {
        headers['Authorization'] = `Bearer ${token}`;
        console.log('🔑 Authorization Header:', headers['Authorization'].substring(0, 30) + '...');
    }

    const options = { method, headers };
    if (body) options.body = JSON.stringify(body);

    try {
        console.log(`📤 ${method} ${API_BASE}${endpoint}`);
        if (body) console.log('📤 Body:', body);
        
        const response = await fetch(`${API_BASE}${endpoint}`, options);
        
        if (response.status === 401) {
            console.error('❌ Unauthorized - Token expired');
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
            return null;
        }
        
        const data = await response.json();
        console.log(`📡 Response (${response.status}):`, data);
        return data;
    } catch (e) {
        console.error('❌ API Error:', e);
        return null;
    }
}

// ============================================
// ✅ تحميل المعامل
// ============================================
async function addLab() {
    // ✅ التحقق من باقة طالب جامعي
    if (isUniversityStudent) {
        alert('⚠️ المعمل غير متاح في باقة طالب جامعي');
        return;
    }

    // ✅ التحقق من وجود التوكن قبل الإضافة
    const token = localStorage.getItem('token');
    if (!token) {
        alert('⚠️ يرجى تسجيل الدخول أولاً');
        window.location.href = 'index.html';
        return;
    }

    if (isLoading) return;
    isLoading = true;

    const list = document.getElementById('labsList');
    list.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

    try {
        const response = await apiCall('/lab', 'GET');
        
        if (response?.labs) {
            labs = response.labs;
            renderLabs();
            isLoading = false;
            return;
        }
        
        // ✅ إذا فشل جلب البيانات
        list.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>
                <h3>فشل في تحميل البيانات</h3>
                <p>يرجى التحقق من اتصالك بالإنترنت</p>
                <button class="retry-btn" onclick="loadLabs()">
                    <i class="fas fa-sync-alt"></i> إعادة المحاولة
                </button>
            </div>
        `;
        isLoading = false;

    } catch (error) {
        console.error('❌ Error loading labs:', error);
        list.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>
                <h3>حدث خطأ</h3>
                <p>فشل في تحميل بيانات المعامل</p>
                <button class="retry-btn" onclick="loadLabs()">
                    <i class="fas fa-sync-alt"></i> إعادة المحاولة
                </button>
            </div>
        `;
        isLoading = false;
    }
}

    // ============================================
// ✅ تحميل المعامل
// ============================================
async function loadLabs() {
    if (isLoading) return;
    isLoading = true;

    const list = document.getElementById('labsList');
    list.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

    try {
        const response = await apiCall('/lab', 'GET');
        
        if (response?.labs) {
            labs = response.labs;
            renderLabs();
            isLoading = false;
            return;
        }
        
        // ✅ إذا فشل جلب البيانات
        list.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>
                <h3>فشل في تحميل البيانات</h3>
                <p>يرجى التحقق من اتصالك بالإنترنت</p>
                <button class="retry-btn" onclick="loadLabs()">
                    <i class="fas fa-sync-alt"></i> إعادة المحاولة
                </button>
            </div>
        `;
        isLoading = false;

    } catch (error) {
        console.error('❌ Error loading labs:', error);
        list.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>
                <h3>حدث خطأ</h3>
                <p>فشل في تحميل بيانات المعامل</p>
                <button class="retry-btn" onclick="loadLabs()">
                    <i class="fas fa-sync-alt"></i> إعادة المحاولة
                </button>
            </div>
        `;
        isLoading = false;
    }
}

// ============================================
// ✅ عرض المعامل
// ============================================
function renderLabs() {
    const list = document.getElementById('labsList');

    if (labs.length === 0) {
        list.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-flask"></i>
                <h3>لا توجد معامل</h3>
                <p>اضغط على زر + لإضافة معمل جديد</p>
            </div>
        `;
        return;
    }

    list.innerHTML = labs.map(lab => {
        const id = lab._id || lab.id || '';
        const name = lab.name || 'غير محدد';
        const phone = lab.phone || '-';
        const address = lab.address || '';

        return `
            <div class="lab-card" onclick="viewLabOrders('${id}')">
                <div class="icon-box"><i class="fas fa-building"></i></div>
                <div class="info">
                    <div class="name">${name}</div>
                    <div class="phone"><i class="fas fa-phone"></i> ${phone}</div>
                    ${address ? `<div class="address"><i class="fas fa-location-dot"></i> ${address}</div>` : ''}
                </div>
                <div class="actions">
                    <button class="delete" onclick="event.stopPropagation();deleteLab('${id}','${name}')" title="حذف المعمل">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
                <div class="arrow"><i class="fas fa-chevron-left"></i></div>
            </div>
        `;
    }).join('');
}

// ============================================
// ✅ إضافة معمل جديد
// ============================================
async function addLab() {
    // ✅ التحقق من باقة طالب جامعي
    if (isUniversityStudent) {
        alert('⚠️ المعمل غير متاح في باقة طالب جامعي');
        return;
    }

    // ✅ نافذة إضافة معمل (مثل التطبيق)
    const name = prompt('📝 أدخل اسم المعمل:');
    if (!name || name.trim() === '') return;

    const phone = prompt('📞 أدخل رقم الجوال:');
    if (!phone || phone.trim() === '') return;

    const address = prompt('📍 أدخل العنوان (اختياري):');

    try {
        console.log('📤 إضافة معمل جديد:', { name, phone, address });
        
        const response = await apiCall('/lab', 'POST', {
            name: name.trim(),
            phone: phone.trim(),
            address: address || ''
        });

        if (response?.success) {
            alert(`✅ تم إضافة المعمل "${name.trim()}" بنجاح`);
            loadLabs();
        } else {
            alert('❌ فشل في إضافة المعمل: ' + (response?.error || 'خطأ غير معروف'));
        }
    } catch (error) {
        console.error('❌ Error adding lab:', error);
        alert('❌ حدث خطأ: ' + (error.message || 'فشل إضافة المعمل'));
    }
}

// ============================================
// ✅ حذف معمل
// ============================================
async function deleteLab(id, name) {
    if (!id) {
        alert('⚠️ لا يمكن حذف هذا المعمل');
        return;
    }

    if (!confirm(`🗑️ هل أنت متأكد من حذف المعمل "${name}"؟`)) return;

    try {
        const response = await apiCall(`/lab/${id}`, 'DELETE');

        if (response?.success) {
            alert('✅ تم حذف المعمل بنجاح');
            loadLabs();
        } else {
            alert('❌ فشل في حذف المعمل: ' + (response?.error || 'خطأ غير معروف'));
        }
    } catch (error) {
        console.error('❌ Error deleting lab:', error);
        alert('❌ حدث خطأ: ' + (error.message || 'فشل حذف المعمل'));
    }
}

// ============================================
// ✅ دوال مساعدة
// ============================================
function toggleSidebar(forceState) {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    if (typeof forceState === 'boolean') {
        sidebar.classList.toggle('open', forceState);
        overlay.classList.toggle('show', forceState);
    } else {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
    }
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'index.html';
}

    if (window.innerWidth > 768) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('show');
    }
});

// ✅ إغلاق القائمة عند الضغط على ESC

});
