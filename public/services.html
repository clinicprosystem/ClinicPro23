<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>ClinicPro - الخدمات والأسعار</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: #f0f4f8;
            min-height: 100vh;
        }

        :root {
            --primary: #1A5F7A;
            --primary-light: #57C0E8;
            --secondary: #57C0E8;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --radius: 16px;
            --sidebar-width: 270px;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 10px; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--primary);
            color: white;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            box-shadow: -4px 0 20px rgba(0,0,0,0.1);
        }

        .sidebar .logo {
            padding: 24px 20px 16px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .sidebar .logo span { color: var(--primary-light); }
        .sidebar .logo i { margin-left: 8px; }

        .sidebar .user-info {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        .sidebar .user-info .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 8px;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .sidebar .user-info .name {
            font-weight: 700;
            font-size: 16px;
        }

        .sidebar .user-info .role {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin-top: 2px;
        }

        .sidebar ul {
            list-style: none;
            padding: 8px 0;
        }

        .sidebar ul li {
            padding: 11px 24px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 14px;
            border-right: 3px solid transparent;
            font-size: 14px;
        }

        .sidebar ul li:hover {
            background: rgba(255,255,255,0.06);
            border-right-color: rgba(255,255,255,0.3);
        }

        .sidebar ul li.active {
            background: rgba(255,255,255,0.1);
            border-right-color: var(--primary-light);
        }

        .sidebar ul li i {
            width: 20px;
            text-align: center;
            font-size: 16px;
            color: rgba(255,255,255,0.7);
        }

        .sidebar ul li.logout {
            color: #fca5a5;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 16px;
        }

        .sidebar ul li.logout:hover {
            background: rgba(239, 68, 68, 0.12);
            border-right-color: #ef4444;
        }

        .sidebar ul li.logout i { color: #fca5a5; }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 999;
            backdrop-filter: blur(2px);
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-right: var(--sidebar-width);
            padding: 20px 24px;
            min-height: 100vh;
            max-width: calc(100% - var(--sidebar-width));
        }

        /* ===== HEADER ===== */
        .header {
            background: white;
            padding: 14px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .left h1 {
            font-size: 20px;
            color: var(--primary);
            font-weight: 800;
        }

        .header .left h1 i {
            margin-left: 8px;
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--primary);
            padding: 4px;
        }

        .header .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header .actions button {
            background: none;
            border: none;
            width: 38px;
            height: 38px;
            font-size: 17px;
            cursor: pointer;
            color: #64748b;
            border-radius: 50%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header .actions button:hover {
            background: #f1f5f9;
            color: var(--primary);
        }

        .offline-badge {
            background: #f59e0b;
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            display: none;
        }

        .offline-badge.show {
            display: inline-block;
        }

        /* ===== FILTERS ===== */
        .filters-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .filter-chip {
            padding: 6px 18px;
            border-radius: 20px;
            border: 2px solid var(--primary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            color: var(--primary);
            white-space: nowrap;
            user-select: none;
        }

        .filter-chip:hover {
            background: #f0f7fa;
            transform: translateY(-1px);
        }

        .filter-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 2px 12px rgba(26, 95, 122, 0.3);
        }

        /* ===== SERVICE CARD ===== */
        .service-card {
            background: white;
            border-radius: var(--radius);
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: all 0.25s ease;
            border: 1px solid transparent;
        }

        .service-card:hover {
            border-color: var(--primary-light);
        }

        .service-card .header-row {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.2s;
        }

        .service-card .header-row:hover {
            background: #f8fafc;
        }

        .service-card .header-row .left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .service-card .header-row .left .icon-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(26, 95, 122, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 20px;
            flex-shrink: 0;
        }

        .service-card .header-row .left .info .name {
            font-weight: 700;
            font-size: 16px;
            color: #0f172a;
        }

        .service-card .header-row .left .info .sub {
            font-size: 12px;
            color: #94a3b8;
        }

        .service-card .header-row .actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .service-card .header-row .actions button {
            background: none;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
            color: #64748b;
        }

        .service-card .header-row .actions button:hover {
            background: #f1f5f9;
            transform: scale(1.05);
        }

        .service-card .header-row .actions button.add:hover {
            background: #dbeafe;
            color: #2563eb;
        }

        .service-card .header-row .actions button.delete:hover {
            background: #fee2e2;
            color: #ef4444;
        }

        .service-card .header-row .arrow {
            color: #94a3b8;
            transition: transform 0.3s ease;
            font-size: 14px;
            margin-right: 8px;
        }

        .service-card .header-row .arrow.open {
            transform: rotate(180deg);
        }

        .service-card .sub-services {
            padding: 0 20px 16px 20px;
            display: none;
        }

        .service-card .sub-services.open {
            display: block;
        }

        .service-card .sub-services .sub-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 8px;
            transition: background 0.2s;
            border-bottom: 1px solid #f1f5f9;
        }

        .service-card .sub-services .sub-item:last-child {
            border-bottom: none;
        }

        .service-card .sub-services .sub-item:hover {
            background: #f8fafc;
        }

        .service-card .sub-services .sub-item .left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .service-card .sub-services .sub-item .left i {
            color: var(--primary);
            font-size: 14px;
            opacity: 0.6;
        }

        .service-card .sub-services .sub-item .left .name {
            font-size: 14px;
            color: #1e293b;
            font-weight: 500;
        }

        .service-card .sub-services .sub-item .left .no-price {
            font-size: 12px;
            color: #94a3b8;
            margin-right: 8px;
        }

        .service-card .sub-services .sub-item .left .sync-badge {
            font-size: 10px;
            color: #f59e0b;
            background: #fef3c7;
            padding: 1px 10px;
            border-radius: 10px;
            font-weight: 500;
            margin-right: 8px;
        }

        .service-card .sub-services .sub-item .right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .service-card .sub-services .sub-item .right .price {
            font-weight: 700;
            color: var(--primary);
            font-size: 14px;
        }

        .service-card .sub-services .sub-item .right .no-price-tag {
            font-size: 12px;
            color: #94a3b8;
        }

        .service-card .sub-services .sub-item .right button {
            background: none;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            color: var(--primary);
        }

        .service-card .sub-services .sub-item .right button:hover {
            background: #f1f5f9;
            transform: scale(1.05);
        }

        .service-card .sub-services .sub-item .right button.edit:hover {
            background: #dbeafe;
            color: #2563eb;
        }

        .service-card .sub-services .sub-item .right button.delete:hover {
            background: #fee2e2;
            color: #ef4444;
        }

        .service-card .sub-services .empty-sub {
            padding: 16px;
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 16px;
            color: #cbd5e1;
        }

        .empty-state h3 {
            font-size: 20px;
            color: #1e293b;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            color: #94a3b8;
        }

        .empty-state .retry-btn {
            margin-top: 16px;
            padding: 10px 32px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .empty-state .retry-btn:hover {
            background: #0f4c5c;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(26, 95, 122, 0.3);
        }

        /* ===== LOADER ===== */
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }

        .loader .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== FAB ===== */
        .fab {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #57C0E8, #4aadcc);
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(87, 192, 232, 0.4);
            transition: all 0.3s ease;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab:hover {
            transform: scale(1.08) rotate(90deg);
            box-shadow: 0 6px 32px rgba(87, 192, 232, 0.5);
        }

        .fab:active {
            transform: scale(0.95);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(100%);
                width: 280px;
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.show { display: block; }
            .main-content {
                margin-right: 0;
                max-width: 100%;
                padding: 16px;
            }
            .hamburger { display: block; }
            .service-card .header-row {
                padding: 14px 16px;
                flex-wrap: wrap;
            }
            .service-card .header-row .left {
                flex: 1 1 100%;
                order: 1;
            }
            .service-card .header-row .actions {
                order: 3;
                flex: 1 1 100%;
                justify-content: flex-start;
                margin-top: 4px;
            }
            .service-card .header-row .arrow {
                order: 2;
            }
            .service-card .sub-services {
                padding: 0 16px 12px 16px;
            }
            .service-card .sub-services .sub-item {
                flex-wrap: wrap;
                gap: 4px;
            }
            .service-card .sub-services .sub-item .left {
                flex: 1 1 100%;
            }
            .service-card .sub-services .sub-item .right {
                flex: 1 1 100%;
                justify-content: flex-start;
                padding-right: 24px;
            }
            .fab {
                bottom: 20px;
                left: 20px;
                width: 52px;
                height: 52px;
                font-size: 24px;
            }
            .header .left h1 {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .main-content {
                padding: 12px;
            }
            .header {
                padding: 12px 16px;
            }
            .header .left h1 {
                font-size: 16px;
            }
            .service-card .header-row .left .info .name {
                font-size: 14px;
            }
            .service-card .sub-services .sub-item .left .name {
                font-size: 13px;
            }
            .filter-chip {
                font-size: 12px;
                padding: 4px 14px;
            }
            .fab {
                bottom: 16px;
                left: 16px;
                width: 48px;
                height: 48px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

<!-- ===== SIDEBAR OVERLAY ===== -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar" id="sidebar">
    <div class="logo">
        <i class="fas fa-tooth"></i> <span>Clinic</span>Pro
    </div>
    <div class="user-info">
        <div class="avatar"><i class="fas fa-user"></i></div>
        <div class="name" id="userName">طبيب الأسنان</div>
        <div class="role" id="userRole">صاحب عيادة</div>
    </div>
    <ul>
        <li onclick="navigateTo('dashboard.html')">
            <i class="fas fa-chart-pie"></i> الرئيسية
        </li>
        <li onclick="navigateTo('patients.html')">
            <i class="fas fa-users"></i> المرضى
        </li>
        <li onclick="navigateTo('treatments.html')">
            <i class="fas fa-tooth"></i> المعالجات
        </li>
        <li class="active">
            <i class="fas fa-list"></i> الخدمات والأسعار
        </li>
        <li onclick="navigateTo('doctors.html')">
            <i class="fas fa-user-md"></i> الأطباء
        </li>
        <li onclick="navigateTo('secretaries.html')">
            <i class="fas fa-user-tie"></i> السكرتيرات
        </li>
        <li onclick="navigateTo('lab.html')">
            <i class="fas fa-flask"></i> المعمل
        </li>
        <li onclick="navigateTo('reports.html')">
            <i class="fas fa-chart-bar"></i> التقارير
        </li>
        <li onclick="navigateTo('notifications.html')">
            <i class="fas fa-bell"></i> الإشعارات
        </li>
        <li onclick="navigateTo('settings.html')">
            <i class="fas fa-cog"></i> الإعدادات
        </li>
        <li onclick="navigateTo('profile.html')">
            <i class="fas fa-user-circle"></i> الملف الشخصي
        </li>
        <li onclick="navigateTo('subscription-plans.html')">
            <i class="fas fa-crown"></i> باقات الاشتراك
        </li>
        <li class="logout" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> تسجيل خروج
        </li>
    </ul>
</div>

<!-- ===== MAIN CONTENT ===== -->
<div class="main-content">
    <!-- ===== HEADER ===== -->
    <div class="header">
        <div class="left">
            <button class="hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <h1><i class="fas fa-list"></i> الخدمات والأسعار</h1>
        </div>
        <div class="actions">
            <button onclick="loadServices()" title="تحديث البيانات">
                <i class="fas fa-sync-alt"></i>
            </button>
            <span class="offline-badge" id="offlineBadge">
                <i class="fas fa-wifi-slash"></i> غير متصل
            </span>
        </div>
    </div>

    <!-- ===== FILTERS ===== -->
    <div class="filters-container" id="filtersContainer">
        <span class="filter-chip active" data-filter="الكل" onclick="filterServices('الكل', this)">الكل</span>
        <span class="filter-chip" data-filter="أسنان" onclick="filterServices('أسنان', this)">أسنان</span>
        <span class="filter-chip" data-filter="فكين" onclick="filterServices('فكين', this)">فكين</span>
    </div>

    <!-- ===== SERVICES LIST ===== -->
    <div id="servicesList">
        <div class="loader"><div class="spinner"></div></div>
    </div>
</div>

<!-- ===== FAB ===== -->
<button class="fab" onclick="addMainService()">
    <i class="fas fa-plus"></i>
</button>

<script>
// ============================================
// ✅ الإعدادات الأساسية
// ============================================
const API_BASE = 'https://clinicprosystem.koyeb.app/api';
let token = localStorage.getItem('token') || '';
let userData = JSON.parse(localStorage.getItem('user') || '{}');
let mainServices = [];
let subServices = {};
let selectedFilter = 'الكل';
let isUniversityStudent = false;
let isLoading = false;
let isOnline = true;

// ============================================
// ✅ دوال API
// ============================================
async function apiCall(endpoint, method = 'GET', body = null) {
    const headers = {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
    };
    if (token) headers['Authorization'] = `Bearer ${token}`;

    const options = { method, headers };
    if (body) options.body = JSON.stringify(body);

    try {
        const response = await fetch(`${API_BASE}${endpoint}`, options);
        if (response.status === 401) {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
            return null;
        }
        return await response.json();
    } catch (e) {
        console.error('❌ API Error:', e);
        return null;
    }
}

// ============================================
// ✅ التنقل
// ============================================
function navigateTo(page) {
    if (window.innerWidth <= 768) toggleSidebar(false);
    window.location.href = page;
}

function toggleSidebar(forceState) {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    if (typeof forceState === 'boolean') {
        sidebar.classList.toggle('open', forceState);
        overlay.classList.toggle('show', forceState);
    } else {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
    }
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'index.html';
}

// ============================================
// ✅ تحميل الخدمات
// ============================================
async function loadServices() {
    if (isLoading) return;
    isLoading = true;

    const list = document.getElementById('servicesList');
    list.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

    try {
        // ✅ جلب الخدمات الرئيسية
        const response = await apiCall('/clinics/main-services');
        
        if (response?.services) {
            mainServices = response.services;
            isOnline = true;
            document.getElementById('offlineBadge').classList.remove('show');
            
            // ✅ جلب الخدمات الفرعية لكل خدمة
            for (let i = 0; i < mainServices.length; i++) {
                const subResponse = await apiCall(`/clinics/sub-services?mainServiceId=${mainServices[i]._id}`);
                if (subResponse?.services) {
                    subServices[mainServices[i]._id] = subResponse.services;
                } else {
                    subServices[mainServices[i]._id] = [];
                }
            }
            
            renderServices();
            isLoading = false;
            return;
        }
        
        // ✅ إذا فشل جلب البيانات
        isOnline = false;
        document.getElementById('offlineBadge').classList.add('show');
        
        list.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>
                <h3>فشل في تحميل البيانات</h3>
                <p>يرجى التحقق من اتصالك بالإنترنت</p>
                <button class="retry-btn" onclick="loadServices()">
                    <i class="fas fa-sync-alt"></i> إعادة المحاولة
                </button>
            </div>
        `;
        isLoading = false;

    } catch (error) {
        console.error('❌ Error loading services:', error);
        list.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>
                <h3>حدث خطأ</h3>
                <p>فشل في تحميل بيانات الخدمات</p>
                <button class="retry-btn" onclick="loadServices()">
                    <i class="fas fa-sync-alt"></i> إعادة المحاولة
                </button>
            </div>
        `;
        isLoading = false;
    }
}

// ============================================
// ✅ عرض الخدمات
// ============================================
function renderServices() {
    const list = document.getElementById('servicesList');

    // ✅ فلترة الخدمات حسب التصنيف
    let filtered = mainServices;
    if (selectedFilter === 'أسنان') {
        filtered = mainServices.filter(s => s.category === 'teeth');
    } else if (selectedFilter === 'فكين') {
        filtered = mainServices.filter(s => s.category === 'arch');
    }

    if (filtered.length === 0) {
        list.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-list"></i>
                <h3>${mainServices.length === 0 ? 'لا توجد خدمات' : 'لا توجد نتائج'}</h3>
                <p>${mainServices.length === 0 ? 'اضغط على زر + لإضافة خدمة رئيسية' : 'جرب فلتر آخر'}</p>
            </div>
        `;
        return;
    }

    list.innerHTML = filtered.map(main => {
        const subs = subServices[main._id] || [];
        const icon = main.category === 'teeth' ? 'fa-tooth' : 'fa-face-smile';
        const categoryName = main.category === 'teeth' ? 'أسنان' : 'فكين';

        return `
            <div class="service-card">
                <div class="header-row" onclick="toggleSubServices(this)">
                    <div class="left">
                        <div class="icon-box"><i class="fas ${icon}"></i></div>
                        <div class="info">
                            <div class="name">${main.name}</div>
                            <div class="sub">${subs.length} خدمة فرعية • ${categoryName}</div>
                        </div>
                    </div>
                    <div class="arrow"><i class="fas fa-chevron-down"></i></div>
                    <div class="actions">
                        <button class="add" onclick="event.stopPropagation();addSubService('${main._id}')" title="إضافة خدمة فرعية">
                            <i class="fas fa-plus"></i>
                        </button>
                        <button class="delete" onclick="event.stopPropagation();deleteMainService('${main._id}','${main.name}')" title="حذف الخدمة">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
                <div class="sub-services">
                    ${subs.length === 0 ? `
                        <div class="empty-sub">
                            <i class="fas fa-plus-circle" style="color:#94a3b8;"></i>
                            لا توجد خدمات فرعية، اضغط على + لإضافة
                        </div>
                    ` : subs.map(sub => {
                        const isSynced = sub.isSynced === 1;
                        return `
                            <div class="sub-item">
                                <div class="left">
                                    <i class="fas fa-arrow-left"></i>
                                    <span class="name">${sub.name}</span>
                                    ${isUniversityStudent ? 
                                        `<span class="no-price">السعر غير محدد لهذه الباقة</span>` : 
                                        ''
                                    }
                                    ${!isSynced && isOnline ? 
                                        `<span class="sync-badge"><i class="fas fa-sync-alt"></i> لم تتم المزامنة</span>` : 
                                        ''
                                    }
                                </div>
                                <div class="right">
                                    ${isUniversityStudent ? 
                                        `<span class="no-price-tag">السعر غير متاح</span>` : 
                                        `<span class="price">${sub.price} ريال</span>`
                                    }
                                    ${!isUniversityStudent ? `
                                        <button class="edit" onclick="event.stopPropagation();editSubService('${sub._id}','${sub.name}','${sub.price}')" title="تعديل السعر">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                    ` : ''}
                                    <button class="delete" onclick="event.stopPropagation();deleteSubService('${sub._id}','${sub.name}')" title="حذف">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        `;
    }).join('');

    // ✅ فتح الخدمة الأولى تلقائياً
    const firstCard = document.querySelector('.service-card');
    if (firstCard) {
        const subContainer = firstCard.querySelector('.sub-services');
        const arrow = firstCard.querySelector('.arrow');
        if (subContainer) {
            subContainer.classList.add('open');
            if (arrow) arrow.classList.add('open');
        }
    }
}

// ============================================
// ✅ فتح/إغلاق الخدمات الفرعية
// ============================================
function toggleSubServices(element) {
    const card = element.closest('.service-card');
    const subContainer = card.querySelector('.sub-services');
    const arrow = card.querySelector('.arrow');
    
    subContainer.classList.toggle('open');
    arrow.classList.toggle('open');
}

// ============================================
// ✅ فلترة الخدمات
// ============================================
function filterServices(filter, element) {
    selectedFilter = filter;
    document.querySelectorAll('.filter-chip').forEach(el => el.classList.remove('active'));
    if (element) element.classList.add('active');
    renderServices();
}

// ============================================
// ✅ إضافة خدمة رئيسية
// ============================================
async function addMainService() {
    // ✅ التحقق من صلاحية طالب جامعي
    if (isUniversityStudent) {
        alert('⚠️ غير مسموح بإضافة خدمات في باقة طالب جامعي');
        return;
    }

    const name = prompt('📝 أدخل اسم الخدمة الرئيسية:');
    if (!name || name.trim() === '') return;

    const category = confirm('🦷 هل هذه الخدمة للفكين؟\n"إلغاء" = أسنان، "موافق" = فكين') ? 'arch' : 'teeth';

    try {
        const response = await apiCall('/clinics/main-services', 'POST', {
            name: name.trim(),
            category: category
        });

        if (response?.success) {
            alert(`✅ تم إضافة الخدمة "${name.trim()}" بنجاح`);
            loadServices();
        } else {
            alert('❌ فشل في إضافة الخدمة: ' + (response?.error || 'خطأ غير معروف'));
        }
    } catch (error) {
        console.error('❌ Error adding main service:', error);
        alert('❌ حدث خطأ: ' + (error.message || 'فشل إضافة الخدمة'));
    }
}

// ============================================
// ✅ إضافة خدمة فرعية
// ============================================
async function addSubService(mainId) {
    const main = mainServices.find(m => m._id === mainId);
    if (!main) return;

    const name = prompt(`📝 أدخل اسم المعالجة لـ "${main.name}":`);
    if (!name || name.trim() === '') return;

    let price = 0;
    if (!isUniversityStudent) {
        const priceInput = prompt('💰 أدخل السعر (ريال):');
        if (priceInput === null) return;
        price = parseInt(priceInput) || 0;
    }

    try {
        const response = await apiCall('/clinics/sub-services', 'POST', {
            name: name.trim(),
            price: price,
            mainServiceId: mainId
        });

        if (response?.success) {
            alert(`✅ تم إضافة المعالجة "${name.trim()}" بنجاح`);
            loadServices();
        } else {
            alert('❌ فشل في إضافة المعالجة: ' + (response?.error || 'خطأ غير معروف'));
        }
    } catch (error) {
        console.error('❌ Error adding sub service:', error);
        alert('❌ حدث خطأ: ' + (error.message || 'فشل إضافة المعالجة'));
    }
}

// ============================================
// ✅ تعديل سعر خدمة فرعية
// ============================================
async function editSubService(id, name, price) {
    if (isUniversityStudent) {
        alert('⚠️ لا يمكنك تعديل الأسعار في باقة طالب جامعي');
        return;
    }

    const newPrice = prompt(`💰 تعديل سعر "${name}":`, price);
    if (newPrice === null) return;
    const newPriceNum = parseInt(newPrice) || 0;

    try {
        const response = await apiCall(`/clinics/sub-services/${id}/price`, 'PUT', {
            price: newPriceNum
        });

        if (response?.success) {
            alert(`✅ تم تحديث السعر إلى ${newPriceNum} ريال`);
            loadServices();
        } else {
            alert('❌ فشل في تحديث السعر: ' + (response?.error || 'خطأ غير معروف'));
        }
    } catch (error) {
        console.error('❌ Error editing sub service:', error);
        alert('❌ حدث خطأ: ' + (error.message || 'فشل تحديث السعر'));
    }
}

// ============================================
// ✅ حذف خدمة رئيسية
// ============================================
async function deleteMainService(id, name) {
    if (!confirm(`🗑️ هل أنت متأكد من حذف الخدمة "${name}"؟\nسيتم حذف جميع المعالجات المرتبطة بها.`)) return;

    try {
        const response = await apiCall(`/clinics/main-services/${id}`, 'DELETE');

        if (response?.success) {
            alert('✅ تم حذف الخدمة بنجاح');
            loadServices();
        } else {
            alert('❌ فشل في حذف الخدمة: ' + (response?.error || 'خطأ غير معروف'));
        }
    } catch (error) {
        console.error('❌ Error deleting main service:', error);
        alert('❌ حدث خطأ: ' + (error.message || 'فشل حذف الخدمة'));
    }
}

// ============================================
// ✅ حذف خدمة فرعية
// ============================================
async function deleteSubService(id, name) {
    if (!confirm(`🗑️ هل أنت متأكد من حذف المعالجة "${name}"؟`)) return;

    try {
        const response = await apiCall(`/clinics/sub-services/${id}`, 'DELETE');

        if (response?.success) {
            alert('✅ تم حذف المعالجة بنجاح');
            loadServices();
        } else {
            alert('❌ فشل في حذف المعالجة: ' + (response?.error || 'خطأ غير معروف'));
        }
    } catch (error) {
        console.error('❌ Error deleting sub service:', error);
        alert('❌ حدث خطأ: ' + (error.message || 'فشل حذف المعالجة'));
    }
}

// ============================================
// ✅ بدء التشغيل

if (!token || token === 'null' || token === 'undefined') {
    window.location.href = 'index.html';
}

if (userData?.name) {

    const roleMap = {
        'clinic_owner': 'صاحب عيادة',
        'university_student': 'طالب جامعي',
        'secretary': 'سكرتير',
        'doctor': 'طبيب'
    };
    document.getElementById('userRole').textContent = roleMap[userData.role] || 'مستخدم';
}

// ✅ التحقق من نوع الاشتراك (طالب جامعي)
if (userData?.role === 'university_student') {
    isUniversityStudent = true;
}

// ✅ تحميل الخدمات
loadServices();

// ✅ إغلاق القائمة الجانبية عند تغيير الحجم
window.addEventListener('resize', () => {
    if (window.innerWidth > 768) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('show');
    }
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('show');
    }
});

console.log('🚀 ClinicPro - Services Screen Loaded');

</script>
